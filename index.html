<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Калейдоскоп — звук Ль</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070512;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
    font-family:Arial,sans-serif;
}


/* =====================================================
   ИГРА
===================================================== */

.game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}


/* =====================================================
   ФОН
===================================================== */

.background{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    z-index:1;
    pointer-events:none;
}


/* =====================================================
   ЛИНЗА
===================================================== */

.portal{
    position:absolute;
    border-radius:50%;
    overflow:hidden;
    z-index:5;
    pointer-events:none;
}


/* =====================================================
   СПРЯТАННАЯ КАРТИНКА
===================================================== */

.hidden-picture{
    position:absolute;
    left:50%;
    top:50%;
    transform:
        translate(-50%,-50%)
        scale(.6);
    opacity:0;
    z-index:2;
    transition:
        opacity .5s ease,
        transform .65s cubic-bezier(.2,.9,.3,1.15);
}

.hidden-picture.visible{
    opacity:1;
    transform:
        translate(-50%,-50%)
        scale(1);
}

.picture{
    font-size:clamp(105px,17vw,235px);
    filter:
        drop-shadow(
            0 10px 15px
            rgba(0,0,0,.5)
        );
}


/* =====================================================
   КАЛЕЙДОСКОП
===================================================== */

.kaleidoscope{
    position:absolute;
    inset:0;
    z-index:5;
    transform-origin:50% 50%;
    will-change:transform;
}


/* =====================================================
   КОНТЕЙНЕР КАМНЯ
===================================================== */

.gem-wrap{
    position:absolute;
    width:14.5%;
    height:14.5%;
    pointer-events:none;
    transform:
        translate(-50%,-50%);
    transform-origin:50% 50%;
    will-change:
        left,
        top,
        opacity,
        transform;
}


/* =====================================================
   PNG-КАМЕНЬ
===================================================== */

.gem{
    position:absolute;
    left:50%;
    top:50%;
    width:100%;
    height:100%;
    object-fit:contain;
    transform-origin:50% 50%;
    pointer-events:none;
    will-change:
        transform,
        filter;
}


/* =====================================================
   БЛИК НА КАМНЕ
===================================================== */

.gem-shine{
    position:absolute;
    left:50%;
    top:50%;
    width:30%;
    height:135%;
    transform:
        translate(-50%,-50%)
        rotate(25deg);
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.72),
            transparent
        );
    opacity:0;
    filter:blur(4px);
    pointer-events:none;
}


/* =====================================================
   БЛИК НА ЛИНЗЕ
===================================================== */

.glass-shine{
    position:absolute;
    inset:0;
    z-index:20;
    border-radius:50%;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 31% 20%,
            rgba(255,255,255,.13),
            transparent 24%
        ),
        radial-gradient(
            circle at center,
            transparent 69%,
            rgba(32,14,65,.18)
        );
}


/* =====================================================
   МЯГКОЕ СВЕЧЕНИЕ В ЦЕНТРЕ ПРИ РАСКРЫТИИ
===================================================== */

.magic-center{
    position:absolute;
    left:50%;
    top:50%;
    width:12%;
    aspect-ratio:1;
    transform:
        translate(-50%,-50%)
        scale(.2);
    border-radius:50%;
    opacity:0;
    z-index:3;
    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.95) 0%,
            rgba(181,116,255,.52) 30%,
            rgba(78,48,170,.10) 62%,
            transparent 75%
        );

    filter:
        blur(4px);

    transition:
        opacity .3s ease;
}


/* =====================================================
   КОЛЕСО
===================================================== */

.wheel-wrap{
    position:absolute;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
}

.wheel{
    width:100%;
    height:100%;
    object-fit:contain;
    cursor:grab;
    touch-action:none;
    transform-origin:50% 50%;
    filter:
        drop-shadow(
            0 10px 13px
            rgba(0,0,0,.5)
        );
    will-change:transform;
}

.wheel.dragging{
    cursor:grabbing;
}


/* =====================================================
   ПОДСКАЗКА
===================================================== */

.hint{
    position:absolute;
    left:50%;
    top:4%;
    transform:translateX(-50%);
    z-index:50;
    color:#fff;
    font-size:clamp(21px,2.3vw,35px);
    font-weight:700;
    white-space:nowrap;
    text-shadow:
        0 3px 8px
        rgba(0,0,0,.95);
    pointer-events:none;
    transition:opacity .3s ease;
}


/* =====================================================
   ДАЛЬШЕ
===================================================== */

.next{
    position:absolute;
    left:50%;
    bottom:4%;
    transform:
        translateX(-50%)
        scale(.8);
    z-index:60;
    padding:14px 34px;
    border:0;
    border-radius:23px;
    background:
        linear-gradient(
            #fff5c5,
            #ffd46a
        );
    color:#55346e;
    font-size:clamp(19px,2vw,27px);
    font-weight:800;
    box-shadow:
        0 6px 0 #a96c25,
        0 11px 20px rgba(0,0,0,.38);
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:
        opacity .35s ease,
        transform .35s ease;
}

.next.visible{
    opacity:1;
    pointer-events:auto;
    transform:
        translateX(-50%)
        scale(1);
}

</style>
</head>

<body>

<div class="game" id="game">

    <img
        src="fon.png"
        class="background"
        id="background"
        alt=""
    >

    <div
        class="hint"
        id="hint"
    >
        Покрути волшебное колесо ✨
    </div>

    <div
        class="portal"
        id="portal"
    >

        <div
            class="hidden-picture"
            id="hiddenPicture"
        >
            <div
                class="picture"
                id="picture"
            >
                🦁
            </div>
        </div>

        <div
            class="magic-center"
            id="magicCenter"
        ></div>

        <div
            class="kaleidoscope"
            id="kaleidoscope"
        ></div>

        <div
            class="glass-shine"
        ></div>

    </div>

    <div
        class="wheel-wrap"
        id="wheelWrap"
    >
        <img
            src="wheel.png"
            class="wheel"
            id="wheel"
            draggable="false"
            alt=""
        >
    </div>

    <button
        class="next"
        id="next"
    >
        Дальше →
    </button>

</div>


<script>

/* =====================================================
   РАУНДЫ
===================================================== */

const rounds = [
    { emoji:"🦁" },
    { emoji:"🦊" },
    { emoji:"🍋" },
    { emoji:"🦢" },
    { emoji:"🍃" }
];

let roundIndex = 0;


/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const game =
    document.getElementById("game");

const background =
    document.getElementById("background");

const portal =
    document.getElementById("portal");

const kaleidoscope =
    document.getElementById("kaleidoscope");

const wheelWrap =
    document.getElementById("wheelWrap");

const wheel =
    document.getElementById("wheel");

const hiddenPicture =
    document.getElementById("hiddenPicture");

const picture =
    document.getElementById("picture");

const magicCenter =
    document.getElementById("magicCenter");

const hint =
    document.getElementById("hint");

const next =
    document.getElementById("next");


/* =====================================================
   РАЗМЕР ФОНА
===================================================== */

const DESIGN_WIDTH =
    1536;

const DESIGN_HEIGHT =
    1024;


/* =====================================================
   ЛИНЗА
===================================================== */

const PORTAL_X =
    325;

const PORTAL_Y =
    133;

const PORTAL_SIZE =
    660;


/* =====================================================
   КОЛЕСО
===================================================== */

const WHEEL_X =
    1065;

const WHEEL_Y =
    490;

const WHEEL_SIZE =
    280;


/* =====================================================
   ПОЗИЦИОНИРОВАНИЕ
===================================================== */

function positionElements(){

    const screenW =
        game.clientWidth;

    const screenH =
        game.clientHeight;

    const scale =
        Math.max(
            screenW / DESIGN_WIDTH,
            screenH / DESIGN_HEIGHT
        );

    const renderedW =
        DESIGN_WIDTH * scale;

    const renderedH =
        DESIGN_HEIGHT * scale;

    const cropX =
        (screenW - renderedW) / 2;

    const cropY =
        (screenH - renderedH) / 2;


    portal.style.left =
        PORTAL_X * scale +
        cropX +
        "px";

    portal.style.top =
        PORTAL_Y * scale +
        cropY +
        "px";

    portal.style.width =
        PORTAL_SIZE * scale +
        "px";

    portal.style.height =
        PORTAL_SIZE * scale +
        "px";


    wheelWrap.style.left =
        WHEEL_X * scale +
        cropX +
        "px";

    wheelWrap.style.top =
        WHEEL_Y * scale +
        cropY +
        "px";

    wheelWrap.style.width =
        WHEEL_SIZE * scale +
        "px";

    wheelWrap.style.height =
        WHEEL_SIZE * scale +
        "px";
}


/* =====================================================
   PNG-КАМНИ
===================================================== */

const gemImages = [
    "gem1.png",
    "gem2.png",
    "gem3.png",
    "gem4.png"
];

let gems = [];


/* =====================================================
   СОЗДАЁМ КАМНИ
===================================================== */

function createGems(){

    kaleidoscope.innerHTML =
        "";

    gems = [];

    const rings = [

        {
            count:8,
            radius:7,
            size:1.30
        },

        {
            count:12,
            radius:16,
            size:1.18
        },

        {
            count:16,
            radius:25,
            size:1.05
        },

        {
            count:18,
            radius:32,
            size:.94
        },

        {
            count:22,
            radius:36.5,
            size:.76
        },

        {
            count:26,
            radius:40,
            size:.56
        }

    ];

    let globalIndex =
        0;


    rings.forEach(
        (
            ring,
            ringIndex
        ) => {

            for(
                let i = 0;
                i < ring.count;
                i++
            ){

                const wrap =
                    document.createElement(
                        "div"
                    );

                wrap.className =
                    "gem-wrap";


                const img =
                    document.createElement(
                        "img"
                    );

                const type =
                    (
                        globalIndex % 4
                    ) + 1;

                img.src =
                    gemImages[
                        type - 1
                    ];

                img.className =
                    "gem";

                img.draggable =
                    false;


                const shine =
                    document.createElement(
                        "div"
                    );

                shine.className =
                    "gem-shine";


                wrap.appendChild(
                    img
                );

                wrap.appendChild(
                    shine
                );

                kaleidoscope.appendChild(
                    wrap
                );


                const angle =
                    (
                        360 /
                        ring.count
                    )
                    * i
                    +
                    ringIndex * 8.2;


                const radiusVariation =
                    (
                        (i % 3) - 1
                    )
                    * .85;


                const scaleVariation =
                    .93
                    +
                    (i % 4)
                    * .03;


                wrap.dataset.angle =
                    angle;

                wrap.dataset.radius =
                    ring.radius +
                    radiusVariation;

                wrap.dataset.scale =
                    ring.size *
                    scaleVariation;

                wrap.dataset.ring =
                    ringIndex;

                wrap.dataset.type =
                    type;

                wrap.dataset.phase =
                    globalIndex * .67;


                gems.push({
                    wrap,
                    img,
                    shine
                });

                globalIndex++;
            }

        }
    );


    updateGems(
        0,
        0
    );
}


/* =====================================================
   АНИМАЦИЯ КАМНЕЙ
===================================================== */

function updateGems(
    progress,
    wheelRotation
){

    /*
    opening:
    0 — центр полностью закрыт
    1 — центр полностью открыт

    Начинаем открывать только после 48%.
    */

    const opening =
        Math.max(
            0,
            Math.min(
                1,
                (progress - .48) / .52
            )
        );


    /*
    Радиус пустого центрального окна.
    В финале примерно 28% от радиуса линзы.
    */

    const openingRadius =
        opening * 28;


    gems.forEach(
        (
            gem,
            index
        ) => {

            const wrap =
                gem.wrap;

            const img =
                gem.img;

            const shine =
                gem.shine;


            const angle =
                Number(
                    wrap.dataset.angle
                );

            const radius =
                Number(
                    wrap.dataset.radius
                );

            const baseScale =
                Number(
                    wrap.dataset.scale
                );

            const ring =
                Number(
                    wrap.dataset.ring
                );

            const phase =
                Number(
                    wrap.dataset.phase
                );


            /* =========================================
               ДВИЖЕНИЕ ПО КОЛЬЦУ
            ========================================= */

            let movementPower =
                1.05;

            if(
                ring === 4
            ){
                movementPower =
                    .65;
            }

            if(
                ring === 5
            ){
                movementPower =
                    .4;
            }


            const movement =
                Math.sin(
                    wheelRotation *
                    .022 +
                    phase
                )
                * movementPower;


            let currentRadius =
                radius +
                movement;


            /* =========================================
               РАСКРЫТИЕ ЦЕНТРА

               Камни внутренних колец
               начинают уходить наружу,
               но не к самой рамке.
            ========================================= */

            if(
                opening > 0
            ){

                const pushStrength =
                    Math.max(
                        0,
                        openingRadius -
                        currentRadius
                    );

                currentRadius +=
                    pushStrength *
                    .72;


                /*
                Чем ближе камень к центру,
                тем сильнее его выталкивает.
                */

                if(
                    ring <= 2
                ){

                    currentRadius +=
                        opening *
                        (
                            3.8 -
                            ring * .8
                        );

                }

            }


            /*
            Жёсткая безопасная граница.
            */

            currentRadius =
                Math.min(
                    currentRadius,
                    39
                );


            /* =========================================
               ПЕРЕСТРОЕНИЕ ПО УГЛУ
            ========================================= */

            let angularPower =
                4;

            if(
                ring === 4
            ){
                angularPower =
                    2.8;
            }

            if(
                ring === 5
            ){
                angularPower =
                    2;
            }


            /*
            В процессе раскрытия
            внутренние кольца чуть сильнее
            сдвигаются относительно друг друга.
            */

            const ringShift =
                opening *
                (
                    ring % 2 === 0
                        ? 7
                        : -7
                );


            const angularMovement =
                Math.sin(
                    wheelRotation *
                    .018 +
                    phase
                )
                * angularPower;


            const currentAngle =
                angle +
                angularMovement +
                ringShift;


            const rad =
                currentAngle *
                Math.PI /
                180;


            const x =
                50 +
                Math.cos(rad) *
                currentRadius;

            const y =
                50 +
                Math.sin(rad) *
                currentRadius;


            wrap.style.left =
                x + "%";

            wrap.style.top =
                y + "%";


            /* =========================================
               ВРАЩЕНИЕ КАМНЯ
            ========================================= */

            const personalDirection =
                index % 2 === 0
                    ? 1
                    : -1;


            const gemRotation =
                currentAngle
                +
                90
                +
                wheelRotation *
                .13 *
                personalDirection
                +
                Math.sin(
                    phase +
                    wheelRotation *
                    .024
                )
                * 8;


            /* =========================================
               ПУЛЬСАЦИЯ
            ========================================= */

            const pulse =
                1
                +
                Math.sin(
                    phase +
                    wheelRotation *
                    .03
                )
                * .045;


            /*
            При раскрытии внутренние камни
            чуть уменьшаются.
            */

            const centerShrink =
                ring <= 2
                    ? 1 -
                      opening *
                      .13
                    : 1;


            img.style.transform = `

                translate(
                    -50%,
                    -50%
                )

                rotate(
                    ${gemRotation}deg
                )

                scale(
                    ${
                        baseScale *
                        pulse *
                        centerShrink
                    }
                )

            `;


            /* =========================================
               ПЕРЕЛИВ
            ========================================= */

            const shimmer =
                Math.sin(
                    phase +
                    wheelRotation *
                    .038
                );


            const brightness =
                1.08 +
                shimmer * .17;


            const glow =
                5 +
                Math.abs(
                    shimmer
                ) * 10;


            img.style.filter = `

                brightness(
                    ${brightness}
                )

                saturate(1.17)

                drop-shadow(
                    0 0
                    ${glow}px
                    rgba(
                        164,
                        115,
                        255,
                        .42
                    )
                )

            `;


            /* =========================================
               БЛИК
            ========================================= */

            shine.style.opacity =
                Math.max(
                    0,
                    shimmer
                ) * .55;


            shine.style.transform = `

                translate(
                    -50%,
                    -50%
                )

                rotate(
                    ${
                        20 +
                        wheelRotation *
                        .12
                    }deg
                )

            `;


            /* =========================================
               ФИНАЛЬНОЕ РАСТВОРЕНИЕ

               Не исчезают сразу.
               Только последние 12%.
            ========================================= */

            let opacity =
                1;


            if(
                progress > .88
            ){

                opacity =
                    1 -
                    (
                        progress - .88
                    )
                    /
                    .12;

            }


            wrap.style.opacity =
                Math.max(
                    0,
                    opacity
                );

        }
    );


    /* =================================================
       СВЕЧЕНИЕ В ЦЕНТРЕ
    ================================================= */

    magicCenter.style.opacity =
        opening * .82;


    magicCenter.style.width =
        (
            12 +
            opening * 52
        )
        + "%";


    magicCenter.style.transform = `

        translate(
            -50%,
            -50%
        )

        scale(
            ${
                .3 +
                opening * .9
            }
        )

    `;


    /* =================================================
       КАРТИНКА ПОЯВЛЯЕТСЯ ПОСТЕПЕННО
    ================================================= */

    if(
        progress > .72
    ){

        const pictureProgress =
            Math.min(
                1,
                (progress - .72) / .28
            );


        hiddenPicture.style.opacity =
            pictureProgress;


        hiddenPicture.style.transform = `

            translate(
                -50%,
                -50%
            )

            scale(
                ${
                    .68 +
                    pictureProgress * .32
                }
            )

        `;

    }
    else{

        hiddenPicture.style.opacity =
            0;

    }

}


/* =====================================================
   СОСТОЯНИЕ
===================================================== */

let dragging =
    false;

let previousAngle =
    0;

let wheelRotation =
    0;

let totalRotation =
    0;

let finished =
    false;


/*
Примерно 1.25 оборота.
*/

const REQUIRED_ROTATION =
    450;


/* =====================================================
   УГОЛ УКАЗАТЕЛЯ
===================================================== */

function pointerAngle(
    event
){

    const rect =
        wheel.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;


    return Math.atan2(

        event.clientY -
        centerY,

        event.clientX -
        centerX

    )
    *
    180 /
    Math.PI;
}


/* =====================================================
   НАЧАЛО ВРАЩЕНИЯ
===================================================== */

wheel.addEventListener(
    "pointerdown",

    event => {

        if(
            finished
        ){
            return;
        }

        dragging =
            true;

        wheel.classList.add(
            "dragging"
        );

        previousAngle =
            pointerAngle(
                event
            );

        wheel.setPointerCapture(
            event.pointerId
        );

        hint.style.opacity =
            ".3";
    }
);


/* =====================================================
   ВРАЩЕНИЕ
===================================================== */

wheel.addEventListener(
    "pointermove",

    event => {

        if(
            !dragging ||
            finished
        ){
            return;
        }


        const currentAngle =
            pointerAngle(
                event
            );


        let delta =
            currentAngle -
            previousAngle;


        if(
            delta > 180
        ){
            delta -= 360;
        }

        if(
            delta < -180
        ){
            delta += 360;
        }


        previousAngle =
            currentAngle;


        wheelRotation +=
            delta;


        totalRotation +=
            Math.abs(
                delta
            );


        /* колесо */

        wheel.style.transform = `

            rotate(
                ${wheelRotation}deg
            )

        `;


        /*
        Весь узор вращается медленнее,
        чем колесо.
        */

        kaleidoscope.style.transform = `

            rotate(
                ${
                    wheelRotation *
                    .18
                }deg
            )

        `;


        const progress =
            Math.min(

                totalRotation /
                REQUIRED_ROTATION,

                1

            );


        updateGems(
            progress,
            wheelRotation
        );


        if(
            progress >= 1
        ){
            revealPicture();
        }

    }
);


/* =====================================================
   КОНЕЦ ВРАЩЕНИЯ
===================================================== */

function stopDragging(){

    dragging =
        false;

    wheel.classList.remove(
        "dragging"
    );
}


wheel.addEventListener(
    "pointerup",
    stopDragging
);


wheel.addEventListener(
    "pointercancel",
    stopDragging
);


/* =====================================================
   ФИНАЛ РАУНДА
===================================================== */

function revealPicture(){

    if(
        finished
    ){
        return;
    }


    finished =
        true;


    hiddenPicture.style.opacity =
        1;


    hiddenPicture.style.transform = `

        translate(
            -50%,
            -50%
        )

        scale(1)

    `;


    hint.textContent =
        "Что ты увидел?";


    hint.style.opacity =
        "1";


    setTimeout(
        () => {

            next.classList.add(
                "visible"
            );

        },
        500
    );
}


/* =====================================================
   НОВЫЙ РАУНД
===================================================== */

function loadRound(){

    const round =
        rounds[
            roundIndex
        ];


    picture.textContent =
        round.emoji;


    hiddenPicture.style.opacity =
        0;


    hiddenPicture.style.transform = `

        translate(
            -50%,
            -50%
        )

        scale(.6)

    `;


    next.classList.remove(
        "visible"
    );


    hint.textContent =
        "Покрути волшебное колесо ✨";


    hint.style.opacity =
        "1";


    magicCenter.style.opacity =
        0;


    dragging =
        false;

    finished =
        false;

    totalRotation =
        0;

    wheelRotation =
        0;


    wheel.style.transform =
        "rotate(0deg)";


    kaleidoscope.style.transform =
        "rotate(0deg)";


    createGems();
}


/* =====================================================
   ДАЛЬШЕ
===================================================== */

next.addEventListener(
    "click",

    () => {

        roundIndex++;


        if(
            roundIndex >=
            rounds.length
        ){
            roundIndex =
                0;
        }


        loadRound();
    }
);


/* =====================================================
   СТАРТ
===================================================== */

background.addEventListener(
    "load",

    () => {

        positionElements();
        loadRound();

    }
);


window.addEventListener(
    "resize",
    positionElements
);


if(
    background.complete
){
    positionElements();
    loadRound();
}

</script>

</body>
</html>
