<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Калейдоскоп — звук Ль</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&display=swap"
    rel="stylesheet"
>

<style>

/* =====================================================
   ОСНОВА
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;

    overflow:hidden;

    background:#070512;

    user-select:none;
    -webkit-user-select:none;

    touch-action:none;

    font-family:"Cormorant SC",serif;
}

button{
    font-family:"Cormorant SC",serif;
}

.app{
    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;
}


/* =====================================================
   МЕНЮ
===================================================== */

.menu-screen{
    position:absolute;

    inset:0;

    z-index:100;

    overflow:hidden;

    opacity:1;
    visibility:visible;

    transition:opacity .45s ease;
}

.menu-screen.hidden{
    opacity:0;
    visibility:hidden;

    pointer-events:none;
}


.menu-background{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    z-index:1;
}


/* =====================================================
   ПЛАШКИ МЕНЮ
===================================================== */

.menu-buttons{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:min(1000px,76vw);

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:
        clamp(
            20px,
            3vw,
            48px
        );

    z-index:5;
}


.menu-button{
    position:relative;

    width:100%;

    aspect-ratio:
        3.5 / 1;

    border:0;

    background:
        url("ramka2.png")
        center /
        contain
        no-repeat;

    cursor:pointer;

    color:#fff8e5;

    font-family:
        "Cormorant SC",
        serif;

    /*
       ШРИФТ УМЕНЬШЕН,
       ЧТОБЫ ДЛИННЫЙ ТЕКСТ ПОМЕЩАЛСЯ
    */

    font-size:
        clamp(
            16px,
            1.65vw,
            26px
        );

    font-weight:700;

    line-height:1.05;

    letter-spacing:.2px;

    padding:
        0 8%;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    white-space:nowrap;

    text-shadow:
        0 2px 4px rgba(0,0,0,.9),
        0 0 8px rgba(188,122,255,.65);

    transition:
        transform .22s ease,
        filter .22s ease;

    appearance:none;
    -webkit-appearance:none;
}


.menu-button:hover{
    transform:
        scale(1.035);

    filter:
        brightness(1.08)
        drop-shadow(
            0 0 8px
            rgba(183,116,255,.42)
        );
}


.menu-button:active{
    transform:
        scale(.985);
}


/* =====================================================
   ИГРОВОЙ ЭКРАН
===================================================== */

.game-screen{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    opacity:0;
    visibility:hidden;

    z-index:10;

    transition:
        opacity .45s ease;
}


.game-screen.visible{
    opacity:1;
    visibility:visible;
}


/* =====================================================
   ФОН ИГРЫ
===================================================== */

.background{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    z-index:1;

    pointer-events:none;
}


/* =====================================================
   КРУГ
===================================================== */

.portal{
    position:absolute;

    border-radius:50%;

    overflow:hidden;

    z-index:5;

    pointer-events:none;
}


/* =====================================================
   КАРТИНКА
===================================================== */

.hidden-picture{
    position:absolute;

    left:50%;
    top:50%;

    width:56%;
    height:56%;

    display:flex;

    align-items:center;
    justify-content:center;

    transform:
        translate(-50%,-50%)
        scale(.62);

    opacity:0;

    background:transparent;

    z-index:8;

    transition:
        opacity .45s ease,
        transform .65s
        cubic-bezier(.2,.9,.3,1.15);
}


.round-image{
    position:relative;

    z-index:3;

    width:100%;
    height:100%;

    display:block;

    object-fit:contain;

    background:transparent;

    pointer-events:none;

    filter:
        drop-shadow(
            0 10px 16px
            rgba(0,0,0,.28)
        );
}


/* =====================================================
   СВЕЧЕНИЕ
===================================================== */

.picture-glow{
    position:absolute;

    left:50%;
    top:50%;

    width:60%;
    height:60%;

    transform:
        translate(-50%,-50%)
        scale(.99);

    border-radius:50%;

    opacity:0;

    pointer-events:none;

    z-index:6;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.18) 0%,
            rgba(202,150,255,.13) 30%,
            rgba(103,112,255,.08) 50%,
            rgba(100,60,180,.03) 66%,
            transparent 79%
        );

    filter:blur(16px);
}


.picture-glow.active{
    animation:
        glowPulse
        8s
        ease-in-out
        infinite;
}


@keyframes glowPulse{

    0%{
        transform:
            translate(-50%,-50%)
            scale(.99);

        opacity:.58;
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(1.012);

        opacity:.73;
    }

    100%{
        transform:
            translate(-50%,-50%)
            scale(.99);

        opacity:.58;
    }
}


/* =====================================================
   МАГИЧЕСКИЙ ЦЕНТР
===================================================== */

.magic-center{
    position:absolute;

    left:50%;
    top:50%;

    width:12%;

    aspect-ratio:1;

    transform:
        translate(-50%,-50%)
        scale(.2);

    border-radius:50%;

    opacity:0;

    z-index:3;

    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.85) 0%,
            rgba(181,116,255,.38) 30%,
            rgba(78,48,170,.08) 62%,
            transparent 75%
        );

    filter:blur(4px);
}


/* =====================================================
   БЛЁСТКИ
===================================================== */

.sparkles{
    position:absolute;

    left:50%;
    top:50%;

    width:64%;
    height:64%;

    transform:
        translate(-50%,-50%);

    pointer-events:none;

    z-index:18;
}


.spark{
    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 5px white,
        0 0 11px rgba(200,135,255,.95),
        0 0 18px rgba(100,160,255,.65);

    opacity:0;

    animation:
        sparklePop
        .95s
        ease-out
        forwards;
}


.spark.star{
    border-radius:0;

    clip-path:
        polygon(
            50% 0%,
            61% 39%,
            100% 50%,
            61% 61%,
            50% 100%,
            39% 61%,
            0% 50%,
            39% 39%
        );
}


@keyframes sparklePop{

    0%{
        opacity:0;

        transform:
            scale(.1)
            rotate(0deg);
    }

    25%{
        opacity:1;

        transform:
            scale(1.2)
            rotate(25deg);
    }

    65%{
        opacity:.8;

        transform:
            scale(.8)
            rotate(50deg);
    }

    100%{
        opacity:0;

        transform:
            scale(.1)
            translateY(-10px)
            rotate(75deg);
    }
}


/* =====================================================
   КАЛЕЙДОСКОП
===================================================== */

.kaleidoscope{
    position:absolute;

    inset:0;

    z-index:5;

    transform-origin:
        50% 50%;

    will-change:transform;
}


/* =====================================================
   КРИСТАЛЛЫ
===================================================== */

.gem-wrap{
    position:absolute;

    width:14.5%;
    height:14.5%;

    pointer-events:none;

    transform:
        translate(-50%,-50%);

    transform-origin:
        50% 50%;
}


.gem{
    position:absolute;

    left:50%;
    top:50%;

    width:100%;
    height:100%;

    object-fit:contain;

    transform-origin:
        50% 50%;

    pointer-events:none;
}


.gem-shine{
    position:absolute;

    left:50%;
    top:50%;

    width:30%;
    height:135%;

    transform:
        translate(-50%,-50%)
        rotate(25deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.72),
            transparent
        );

    opacity:0;

    filter:blur(4px);

    pointer-events:none;
}


/* =====================================================
   БЛИК СТЕКЛА
===================================================== */

.glass-shine{
    position:absolute;

    inset:0;

    z-index:20;

    border-radius:50%;

    pointer-events:none;

    background:
        radial-gradient(
            circle at 31% 20%,
            rgba(255,255,255,.13),
            transparent 24%
        ),

        radial-gradient(
            circle at center,
            transparent 69%,
            rgba(32,14,65,.18)
        );
}


/* =====================================================
   КОЛЕСО
===================================================== */

.wheel-wrap{
    position:absolute;

    z-index:30;

    display:flex;

    align-items:center;
    justify-content:center;
}


.wheel{
    width:100%;
    height:100%;

    object-fit:contain;

    cursor:grab;

    touch-action:none;

    transform-origin:
        50% 50%;

    filter:
        drop-shadow(
            0 10px 13px
            rgba(0,0,0,.5)
        );

    will-change:transform;
}


.wheel.dragging{
    cursor:grabbing;
}


/* =====================================================
   ПОКРУТИ КОЛЕСО
   ОСТАВЛЯЕМ ВНИЗУ
===================================================== */

.wheel-hint{
    position:absolute;

    right:7%;
    bottom:2.1%;

    z-index:45;

    font-weight:700;

    font-size:
        clamp(
            24px,
            2.05vw,
            34px
        );

    letter-spacing:1.1px;

    color:#fff8e5;

    white-space:nowrap;

    pointer-events:none;

    text-shadow:
        0 2px 4px rgba(0,0,0,.9),
        0 0 7px rgba(184,116,255,.52);

    opacity:1;

    transition:
        opacity .5s ease;
}


.wheel-hint.hidden{
    opacity:0;
}


/* =====================================================
   ДАЛЬШЕ
===================================================== */

.next{
    position:absolute;

    left:85.5%;
    top:32%;

    width:
        clamp(
            195px,
            19vw,
            305px
        );

    height:
        clamp(
            80px,
            8vw,
            122px
        );

    transform:
        translate(-50%,-50%)
        scale(.82);

    z-index:60;

    border:0;

    padding:
        0 30px;

    background:
        url("ramka.png")
        center /
        contain
        no-repeat;

    color:#fff6da;

    font-size:
        clamp(
            22px,
            2vw,
            32px
        );

    font-weight:700;

    letter-spacing:1px;

    text-shadow:
        0 2px 3px rgba(0,0,0,.9),
        0 0 7px rgba(214,167,255,.65);

    cursor:pointer;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .5s ease,
        transform .5s
        cubic-bezier(.2,.8,.3,1.15);

    appearance:none;
    -webkit-appearance:none;
}


.next.visible{
    opacity:1;

    pointer-events:auto;

    transform:
        translate(-50%,-50%)
        scale(1);
}


.next:hover{
    transform:
        translate(-50%,-50%)
        scale(1.04);
}


/* =====================================================
   МАЛЕНЬКИЕ ЭКРАНЫ
===================================================== */

@media(max-width:800px){

    .menu-buttons{
        width:min(
            680px,
            88vw
        );

        grid-template-columns:
            1fr;

        gap:10px;
    }


    .menu-button{
        aspect-ratio:
            4.6 / 1;

        font-size:
            clamp(
                15px,
                3.4vw,
                23px
            );
    }


    .wheel-hint{
        right:5%;
        bottom:2%;

        font-size:
            clamp(
                20px,
                4vw,
                28px
            );
    }

}

</style>

</head>

    ></audio>


</div>

</div>


<script>

/* =====================================================

===================================================== */

const sections = {

/* =====================================================

===================================================== */

let currentSection =
    null;

let rounds =
    [];

let roundIndex =
    0;


/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const menuScreen =
    document.getElementById(
        "menuScreen"
    );


const gameScreen =
    document.getElementById(
        "gameScreen"

const game =
    gameScreen;


const portal =

    );

/* =====================================================
   РАЗМЕРЫ
===================================================== */

const DESIGN_WIDTH =
    1536;


const DESIGN_HEIGHT =
    1024;


const PORTAL_X =
    325;


const PORTAL_Y =
    133;


const PORTAL_SIZE =
    660;


const WHEEL_X =
    1065;


const WHEEL_Y =
    490;


const WHEEL_SIZE =
    280;


/* =====================================================
   ПОЗИЦИОНИРОВАНИЕ
===================================================== */

function positionElements(){

    const screenW =
        game.clientWidth;


    const screenH =
        game.clientHeight;


    const scale =
        Math.max(
            screenW / DESIGN_WIDTH,
            screenH / DESIGN_HEIGHT
        );


    const renderedW =
        DESIGN_WIDTH *
        scale;


    const renderedH =
        DESIGN_HEIGHT *
        scale;


    const cropX =
        (
            screenW -
            renderedW
        ) / 2;


    const cropY =
        (
            screenH -
            renderedH
        ) / 2;


    portal.style.left =
        PORTAL_X *
        scale +
        cropX +
        "px";


    portal.style.top =
        PORTAL_Y *
        scale +
        cropY +
        "px";


    portal.style.width =
        PORTAL_SIZE *
        scale +
        "px";


    portal.style.height =
        PORTAL_SIZE *
        scale +
        "px";


    wheelWrap.style.left =
        WHEEL_X *
        scale +
        cropX +
        "px";


    wheelWrap.style.top =
        WHEEL_Y *
        scale +
        cropY +
        "px";


    wheelWrap.style.width =
        WHEEL_SIZE *
        scale +
        "px";


    wheelWrap.style.height =
        WHEEL_SIZE *
        scale +
        "px";

}


/* =====================================================
   КРИСТАЛЛЫ
===================================================== */

const gemImages = [

    "gem1.png",
    "gem2.png",
    "gem3.png",
    "gem4.png"

];


let gems =
    [];


/* =====================================================
   СОЗДАНИЕ КРИСТАЛЛОВ
===================================================== */

function createGems(){

    kaleidoscope.innerHTML =
        "";


    gems =
        [];


    const rings = [

        {
            count:8,
            radius:7,
            size:1.30
        },

        {
            count:12,
            radius:16,
            size:1.18
        },

        {
            count:16,
            radius:25,
            size:1.05
        },

        {
            count:18,
            radius:32,
            size:.94
        },

        {
            count:22,
            radius:36.5,
            size:.76
        },

        {
            count:26,
            radius:40,
            size:.56
        }

    ];


    let globalIndex =
        0;


    rings.forEach(
        (
            ring,
            ringIndex
        ) => {


            for(
                let i = 0;
                i < ring.count;
                i++
            ){


                const wrap =
                    document.createElement(
                        "div"
                    );


                wrap.className =
                    "gem-wrap";


                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    gemImages[
                        globalIndex %
                        gemImages.length
                    ];


                img.className =
                    "gem";


                img.draggable =
                    false;


                const shine =
                    document.createElement(
                        "div"
                    );


                shine.className =
                    "gem-shine";


                wrap.appendChild(
                    img
                );


                wrap.appendChild(
                    shine
                );


                kaleidoscope.appendChild(
                    wrap
                );


                const angle =
                    (
                        360 /
                        ring.count
                    )
                    *
                    i
                    +
                    ringIndex *
                    8.2;


                const radiusVariation =
                    (
                        (
                            i % 3
                        )
                        -
                        1
                    )
                    *
                    .85;


                const scaleVariation =
                    .93
                    +
                    (
                        i % 4
                    )
                    *
                    .03;


                wrap.dataset.angle =
                    angle;


                wrap.dataset.radius =
                    ring.radius +
                    radiusVariation;


                wrap.dataset.scale =
                    ring.size *
                    scaleVariation;


                wrap.dataset.ring =
                    ringIndex;


                wrap.dataset.phase =
                    globalIndex *
                    .67;


                gems.push({

                    wrap,
                    img,
                    shine

                });


                globalIndex++;

            }

        }

    );


    updateGems(
        0,
        0
    );

}


/* =====================================================
   БЛЁСТКИ
===================================================== */

function createSparkles(){

    sparkles.innerHTML =
        "";


    const count =
        16;


    for(
        let i = 0;
        i < count;
        i++
    ){

        const spark =
            document.createElement(
                "div"
            );


        spark.className =
            Math.random() >
            .45
                ?
                "spark star"
                :
                "spark";


        const angle =
            Math.random() *
            Math.PI *
            2;


        const radius =
            15 +
            Math.random() *
            34;


        const x =
            50 +
            Math.cos(
                angle
            )
            *
            radius;


        const y =
            50 +
            Math.sin(
                angle
            )
            *
            radius;


        const size =
            4 +
            Math.random() *
            6;


        spark.style.left =
            x +
            "%";


        spark.style.top =
            y +
            "%";


        spark.style.width =
            size +
            "px";


        spark.style.height =
            size +
            "px";


        spark.style.animationDelay =
            Math.random() *
            .2 +
            "s";


        sparkles.appendChild(
            spark
        );

    }

}


/* =====================================================
   МАГИЧЕСКИЙ ЭФФЕКТ
===================================================== */

let sparkleInterval =
    null;


function startMagicEffect(){

    pictureGlow.classList.add(
        "active"
    );


    createSparkles();


    clearInterval(
        sparkleInterval
    );


    sparkleInterval =
        setInterval(
            createSparkles,
            1150
        );

}


function stopMagicEffect(){

    pictureGlow.classList.remove(
        "active"
    );


    clearInterval(
        sparkleInterval
    );


    sparkleInterval =
        null;


    sparkles.innerHTML =
        "";

}


/* =====================================================
   МУЗЫКА
===================================================== */

let fadeTimer =
    null;


function startWheelMusic(){

    clearInterval(
        fadeTimer
    );


    fadeTimer =
        null;


    wheelMusic.volume =
        .42;


    wheelMusic
        .play()
        .catch(
            () => {}
        );

}


/* =====================================================
   ПЛАВНАЯ ОСТАНОВКА МУЗЫКИ
===================================================== */

function stopWheelMusic(){

    clearInterval(
        fadeTimer
    );


    const startVolume =
        wheelMusic.volume;


    let currentStep =
        0;


    const steps =
        10;


    const duration =
        250;


    fadeTimer =
        setInterval(

            () => {


                currentStep++;


                const progress =
                    currentStep /
                    steps;


                wheelMusic.volume =
                    Math.max(
                        0,
                        startVolume *
                        (
                            1 -
                            progress
                        )
                    );


                if(
                    currentStep >=
                    steps
                ){


                    clearInterval(
                        fadeTimer
                    );


                    fadeTimer =
                        null;


                    wheelMusic.pause();


                    wheelMusic.volume =
                        .42;

                }

            },

            duration /
            steps

        );

}


/* =====================================================
   СБРОС МУЗЫКИ
===================================================== */

function resetWheelMusic(){

    clearInterval(
        fadeTimer
    );


    fadeTimer =
        null;


    wheelMusic.pause();


    try{

        wheelMusic.currentTime =
            0;

    }
    catch(error){}


    wheelMusic.volume =
        .42;

}


/* =====================================================
   АНИМАЦИЯ КРИСТАЛЛОВ
===================================================== */

function updateGems(
    progress,
    wheelRotation
){

    const opening =
        Math.max(
            0,
            Math.min(
                1,
                (
                    progress -
                    .48
                )
                /
                .52
            )
        );


    const openingRadius =
        opening *
        28;


    gems.forEach(
        (
            gem,
            index
        ) => {


            const wrap =
                gem.wrap;


            const img =
                gem.img;


            const shine =
                gem.shine;


            const angle =
                Number(
                    wrap.dataset.angle
                );


            const radius =
                Number(
                    wrap.dataset.radius
                );


            const baseScale =
                Number(
                    wrap.dataset.scale
                );


            const ring =
                Number(
                    wrap.dataset.ring
                );


            const phase =
                Number(
                    wrap.dataset.phase
                );


            let movementPower =
                1.05;


            if(
                ring === 4
            ){

                movementPower =
                    .65;

            }


            if(
                ring === 5
            ){

                movementPower =
                    .4;

            }


            const movement =
                Math.sin(
                    wheelRotation *
                    .022 +
                    phase
                )
                *
                movementPower;


            let currentRadius =
                radius +
                movement;


            if(
                opening > 0
            ){


                const pushStrength =
                    Math.max(
                        0,
                        openingRadius -
                        currentRadius
                    );


                currentRadius +=
                    pushStrength *
                    .72;


                if(
                    ring <= 2
                ){

                    currentRadius +=
                        opening *
                        (
                            3.8 -
                            ring *
                            .8
                        );

                }

            }


            currentRadius =
                Math.min(
                    currentRadius,
                    39
                );


            let angularPower =
                4;


            if(
                ring === 4
            ){

                angularPower =
                    2.8;

            }


            if(
                ring === 5
            ){

                angularPower =
                    2;

            }


            const ringShift =
                opening *
                (
                    ring % 2 === 0
                        ?
                        7
                        :
                        -7
                );


            const angularMovement =
                Math.sin(
                    wheelRotation *
                    .018 +
                    phase
                )
                *
                angularPower;


            const currentAngle =
                angle +
                angularMovement +
                ringShift;


            const rad =
                currentAngle *
                Math.PI /
                180;


            const x =
                50 +
                Math.cos(
                    rad
                )
                *
                currentRadius;


            const y =
                50 +
                Math.sin(
                    rad
                )
                *
                currentRadius;


            wrap.style.left =
                x +
                "%";


            wrap.style.top =
                y +
                "%";


            const personalDirection =
                index % 2 === 0
                    ?
                    1
                    :
                    -1;


            const gemRotation =
                currentAngle
                +
                90
                +
                wheelRotation *
                .13 *
                personalDirection
                +
                Math.sin(
                    phase +
                    wheelRotation *
                    .024
                )
                *
                8;


            const pulse =
                1
                +
                Math.sin(
                    phase +
                    wheelRotation *
                    .03
                )
                *
                .045;


            const centerShrink =
                ring <= 2
                    ?
                    1 -
                    opening *
                    .13
                    :
                    1;


            img.style.transform = `

                translate(
                    -50%,
                    -50%
                )

                rotate(
                    ${gemRotation}deg
                )

                scale(
                    ${
                        baseScale *
                        pulse *
                        centerShrink
                    }
                )

            `;


            const shimmer =
                Math.sin(
                    phase +
                    wheelRotation *
                    .038
                );


            const brightness =
                1.08 +
                shimmer *
                .17;


            const glow =
                5 +
                Math.abs(
                    shimmer
                )
                *
                10;


            img.style.filter = `

                brightness(
                    ${brightness}
                )

                saturate(
                    1.17
                )

                drop-shadow(
                    0 0
                    ${glow}px
                    rgba(
                        164,
                        115,
                        255,
                        .42
                    )
                )

            `;


            shine.style.opacity =
                Math.max(
                    0,
                    shimmer
                )
                *
                .55;


            let opacity =
                1;


            if(
                progress >
                .88
            ){

                opacity =
                    1 -
                    (
                        progress -
                        .88
                    )
                    /
                    .12;

            }


            wrap.style.opacity =
                Math.max(
                    0,
                    opacity
                );

        }

    );


    magicCenter.style.opacity =
        opening *
        .55;


    magicCenter.style.width =
        (
            12 +
            opening *
            48
        )
        +
        "%";


    if(
        progress >
        .72
    ){


        const pictureProgress =
            Math.min(
                1,
                (
                    progress -
                    .72
                )
                /
                .28
            );


        hiddenPicture.style.opacity =
            pictureProgress;


        hiddenPicture.style.transform = `

            translate(
                -50%,
                -50%
            )

            scale(
                ${
                    .72 +
                    pictureProgress *
                    .28
                }
            )

        `;

    }

    else{

        hiddenPicture.style.opacity =
            0;

    }

}


/* =====================================================
   СОСТОЯНИЕ ВРАЩЕНИЯ
===================================================== */

let dragging =
    false;


let previousAngle =
    0;


let wheelRotation =
    0;


let totalRotation =
    0;


let finished =
    false;


const REQUIRED_ROTATION =
    450;


/* =====================================================
   УГОЛ
===================================================== */

function pointerAngle(
    event
){

    const rect =
        wheel.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width /
        2;


    const centerY =
        rect.top +
        rect.height /
        2;


    return Math.atan2(

        event.clientY -
        centerY,

        event.clientX -
        centerX

    )
    *
    180 /
    Math.PI;

}


/* =====================================================
   НАЧАЛО ВРАЩЕНИЯ
===================================================== */

wheel.addEventListener(
    "pointerdown",

    event => {


        if(
            finished
        ){

            return;

        }


        dragging =
            true;


        wheel.classList.add(
            "dragging"
        );


        previousAngle =
            pointerAngle(
                event
            );


        wheel.setPointerCapture(
            event.pointerId
        );


        startWheelMusic();

    }
);


/* =====================================================
   ДВИЖЕНИЕ
===================================================== */

wheel.addEventListener(
    "pointermove",

    event => {


        if(
            !dragging ||
            finished
        ){

            return;

        }


        const currentAngle =
            pointerAngle(
                event
            );


        let delta =
            currentAngle -
            previousAngle;


        if(
            delta >
            180
        ){

            delta -=
                360;

        }


        if(
            delta <
            -180
        ){

            delta +=
                360;

        }


        previousAngle =
            currentAngle;


        wheelRotation +=
            delta;


        totalRotation +=
            Math.abs(
                delta
            );


        wheel.style.transform = `

            rotate(
                ${wheelRotation}deg
            )

        `;


        kaleidoscope.style.transform = `

            rotate(
                ${
                    wheelRotation *
                    .18
                }deg
            )

        `;


        const progress =
            Math.min(
                totalRotation /
                REQUIRED_ROTATION,
                1
            );


        updateGems(
            progress,
            wheelRotation
        );


        if(
            progress >=
            1
        ){

            revealPicture();

        }

    }
);


/* =====================================================
   КОНЕЦ ВРАЩЕНИЯ
===================================================== */

function stopDragging(){

    if(
        !dragging
    ){

        return;

    }


    dragging =
        false;


    wheel.classList.remove(
        "dragging"
    );


    stopWheelMusic();

}


wheel.addEventListener(
    "pointerup",
    stopDragging
);


wheel.addEventListener(
    "pointercancel",
    stopDragging
);


/* =====================================================
   ПОКАЗ КАРТИНКИ
===================================================== */

function revealPicture(){

    if(
        finished
    ){

        return;

    }


    finished =
        true;


    dragging =
        false;


    wheel.classList.remove(
        "dragging"
    );


    stopWheelMusic();


    wheelHint.classList.add(
        "hidden"
    );


    hiddenPicture.style.opacity =
        1;


    hiddenPicture.style.transform = `

        translate(
            -50%,
            -50%
        )

        scale(1)

    `;


    startMagicEffect();


    if(
        roundIndex ===
        rounds.length - 1
    ){

        next.textContent =
            "В меню";

    }

    else{

        next.textContent =
            "Дальше";

    }


    setTimeout(

        () => {

            next.classList.add(
                "visible"
            );

        },

        450

    );

}


/* =====================================================
   ЗАГРУЗКА РАУНДА
===================================================== */

function loadRound(){

    stopMagicEffect();


    resetWheelMusic();


    roundImage.src =
        rounds[
            roundIndex
        ];


    hiddenPicture.style.opacity =
        0;


    hiddenPicture.style.transform = `

        translate(
            -50%,
            -50%
        )

        scale(.62)

    `;


    next.classList.remove(
        "visible"
    );


    next.textContent =
        "Дальше";


    wheelHint.classList.remove(
        "hidden"
    );


    magicCenter.style.opacity =
        0;


    dragging =
        false;


    finished =
        false;


    totalRotation =
        0;


    wheelRotation =
        0;


    wheel.style.transform =
        "rotate(0deg)";


    kaleidoscope.style.transform =
        "rotate(0deg)";


    createGems();

}


/* =====================================================
   ОТКРЫТИЕ РАЗДЕЛА
===================================================== */

function openSection(
    sectionName
){

    currentSection =
        sectionName;


    rounds =
        sections[
            sectionName
        ];


    roundIndex =
        0;


    menuScreen.classList.add(
        "hidden"
    );


    gameScreen.classList.add(
        "visible"
    );


    requestAnimationFrame(
        () => {

            positionElements();

            loadRound();

        }
    );

}


/* =====================================================
   ВОЗВРАТ В МЕНЮ
===================================================== */

function returnToMenu(){

    stopMagicEffect();


    resetWheelMusic();


    currentSection =
        null;


    rounds =
        [];


    roundIndex =
        0;


    next.classList.remove(
        "visible"
    );


    wheelHint.classList.remove(
        "hidden"
    );


    gameScreen.classList.remove(
        "visible"
    );


    menuScreen.classList.remove(
        "hidden"
    );

}


/* =====================================================
   КНОПКИ МЕНЮ
===================================================== */

document
    .querySelectorAll(
        ".menu-button"
    )
    .forEach(

        button => {


            button.addEventListener(
                "click",

                () => {


                    const section =
                        button.dataset.section;


                    openSection(
                        section
                    );

                }
            );

        }

    );


/* =====================================================
   ДАЛЬШЕ / В МЕНЮ
===================================================== */

next.addEventListener(
    "click",

    () => {


        if(
            roundIndex >=
            rounds.length - 1
        ){

            returnToMenu();

            return;

        }


        roundIndex++;


        loadRound();

    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",

    () => {


        if(
            gameScreen.classList.contains(
                "visible"
            )
        ){

            positionElements();

        }

    }
);


/* =====================================================
   СТАРТ
===================================================== */

resetWheelMusic();

</script>

</html>
