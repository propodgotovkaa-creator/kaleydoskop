<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Калейдоскоп — звук Ль</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070512;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
    font-family:Arial,sans-serif;
}


/* =====================================================
   ОСНОВА
===================================================== */

.game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

.background{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    z-index:1;
    pointer-events:none;
}


/* =====================================================
   ВНУТРЕННЯЯ ОБЛАСТЬ ЛИНЗЫ
===================================================== */

.portal{
    position:absolute;

    border-radius:50%;
    overflow:hidden;

    z-index:5;

    pointer-events:none;
}


/* =====================================================
   СПРЯТАННАЯ КАРТИНКА
===================================================== */

.hidden-picture{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.45);

    opacity:0;

    z-index:2;

    transition:
        opacity .7s ease,
        transform .8s cubic-bezier(.2,.9,.3,1.2);
}

.hidden-picture.visible{
    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

.picture{
    font-size:clamp(100px,17vw,230px);

    filter:
        drop-shadow(
            0 10px 15px
            rgba(0,0,0,.5)
        );
}


/* =====================================================
   КАЛЕЙДОСКОП
===================================================== */

.kaleidoscope{
    position:absolute;
    inset:0;

    z-index:5;

    transform-origin:
        50% 50%;

    will-change:transform;
}


/* =====================================================
   РЕАЛЬНЫЕ PNG-КАМНИ
===================================================== */

.gem{
    position:absolute;

    left:50%;
    top:50%;

    width:14%;
    height:auto;

    transform-origin:
        50% 50%;

    pointer-events:none;

    will-change:
        transform,
        opacity,
        filter;
}


/* разные типы камней */

.gem.type1{
    width:12%;
}

.gem.type2{
    width:15%;
}

.gem.type3{
    width:11%;
}

.gem.type4{
    width:14%;
}


/* мягкое сияние */

.gem{
    filter:
        brightness(1.05)
        saturate(1.08)
        drop-shadow(
            0 0 8px
            rgba(160,120,255,.28)
        );
}


/* =====================================================
   БЛИК
===================================================== */

.gem-wrap{
    position:absolute;

    left:50%;
    top:50%;

    pointer-events:none;

    transform-origin:
        50% 50%;

    will-change:
        transform,
        opacity;
}


/* маленький дополнительный перелив */

.gem-shine{
    position:absolute;

    left:50%;
    top:50%;

    width:30%;
    height:140%;

    transform:
        translate(-50%,-50%)
        rotate(22deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.65),
            transparent
        );

    opacity:0;

    filter:blur(4px);

    pointer-events:none;
}


/* =====================================================
   СТЕКЛЯННЫЙ БЛИК НА ВСЕЙ ЛИНЗЕ
===================================================== */

.glass-shine{
    position:absolute;
    inset:0;

    z-index:20;

    border-radius:50%;

    pointer-events:none;

    background:

        radial-gradient(
            circle at 32% 20%,
            rgba(255,255,255,.16),
            transparent 23%
        ),

        radial-gradient(
            circle at center,
            transparent 68%,
            rgba(27,11,64,.18)
        );
}


/* =====================================================
   КОЛЕСО
===================================================== */

.wheel-wrap{
    position:absolute;

    z-index:30;

    display:flex;
    align-items:center;
    justify-content:center;
}

.wheel{
    width:100%;
    height:100%;

    object-fit:contain;

    cursor:grab;

    touch-action:none;

    transform-origin:
        50% 50%;

    filter:
        drop-shadow(
            0 10px 13px
            rgba(0,0,0,.5)
        );

    will-change:transform;
}

.wheel.dragging{
    cursor:grabbing;
}


/* =====================================================
   ТЕКСТ
===================================================== */

.hint{
    position:absolute;

    left:50%;
    top:4%;

    transform:
        translateX(-50%);

    z-index:50;

    color:#fff;

    font-size:
        clamp(
            21px,
            2.3vw,
            35px
        );

    font-weight:700;

    white-space:nowrap;

    text-shadow:
        0 3px 8px
        rgba(0,0,0,.95);

    pointer-events:none;

    transition:
        opacity .3s ease;
}


/* =====================================================
   ДАЛЬШЕ
===================================================== */

.next{
    position:absolute;

    left:50%;
    bottom:4%;

    transform:
        translateX(-50%)
        scale(.8);

    z-index:60;

    padding:
        14px 34px;

    border:0;
    border-radius:23px;

    background:
        linear-gradient(
            #fff5c5,
            #ffd46a
        );

    color:#55346e;

    font-size:
        clamp(
            19px,
            2vw,
            27px
        );

    font-weight:800;

    box-shadow:
        0 6px 0 #a96c25,
        0 11px 20px rgba(0,0,0,.38);

    cursor:pointer;

    opacity:0;
    pointer-events:none;

    transition:
        opacity .35s ease,
        transform .35s ease;
}

.next.visible{
    opacity:1;
    pointer-events:auto;

    transform:
        translateX(-50%)
        scale(1);
}

</style>

</head>

<body>

<div
    class="game"
    id="game"
>

    <img
        src="fon.png"
        class="background"
        id="background"
        alt=""
    >

    <div
        class="hint"
        id="hint"
    >
        Покрути волшебное колесо ✨
    </div>


    <div
        class="portal"
        id="portal"
    >

        <div
            class="hidden-picture"
            id="hiddenPicture"
        >
            <div
                class="picture"
                id="picture"
            >
                🦁
            </div>
        </div>


        <div
            class="kaleidoscope"
            id="kaleidoscope"
        ></div>


        <div
            class="glass-shine"
        ></div>

    </div>


    <div
        class="wheel-wrap"
        id="wheelWrap"
    >

        <img
            src="wheel.png"
            class="wheel"
            id="wheel"
            draggable="false"
            alt=""
        >

    </div>


    <button
        class="next"
        id="next"
    >
        Дальше →
    </button>

</div>


<script>

/* =====================================================
   РАУНДЫ
===================================================== */

const rounds = [

    { emoji:"🦁" },
    { emoji:"🦊" },
    { emoji:"🍋" },
    { emoji:"🦢" },
    { emoji:"🍃" }

];

let roundIndex = 0;


/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const game =
    document.getElementById("game");

const background =
    document.getElementById("background");

const portal =
    document.getElementById("portal");

const kaleidoscope =
    document.getElementById("kaleidoscope");

const wheelWrap =
    document.getElementById("wheelWrap");

const wheel =
    document.getElementById("wheel");

const hiddenPicture =
    document.getElementById("hiddenPicture");

const picture =
    document.getElementById("picture");

const hint =
    document.getElementById("hint");

const next =
    document.getElementById("next");


/* =====================================================
   РАЗМЕР ИСХОДНОГО ФОНА
===================================================== */

const DESIGN_WIDTH =
    1536;

const DESIGN_HEIGHT =
    1024;


/* =====================================================
   ЛИНЗА
===================================================== */

const PORTAL_X =
    337;

const PORTAL_Y =
    105;

const PORTAL_SIZE =
    660;


/* =====================================================
   КОЛЕСО
===================================================== */

const WHEEL_X =
    1065;

const WHEEL_Y =
    490;

const WHEEL_SIZE =
    280;


/* =====================================================
   ПОЗИЦИОНИРОВАНИЕ
===================================================== */

function positionElements(){

    const screenW =
        game.clientWidth;

    const screenH =
        game.clientHeight;


    const scale =
        Math.max(
            screenW / DESIGN_WIDTH,
            screenH / DESIGN_HEIGHT
        );


    const renderedW =
        DESIGN_WIDTH * scale;

    const renderedH =
        DESIGN_HEIGHT * scale;


    const cropX =
        (screenW - renderedW) / 2;

    const cropY =
        (screenH - renderedH) / 2;


    portal.style.left =
        PORTAL_X * scale +
        cropX +
        "px";

    portal.style.top =
        PORTAL_Y * scale +
        cropY +
        "px";

    portal.style.width =
        PORTAL_SIZE * scale +
        "px";

    portal.style.height =
        PORTAL_SIZE * scale +
        "px";


    wheelWrap.style.left =
        WHEEL_X * scale +
        cropX +
        "px";

    wheelWrap.style.top =
        WHEEL_Y * scale +
        cropY +
        "px";

    wheelWrap.style.width =
        WHEEL_SIZE * scale +
        "px";

    wheelWrap.style.height =
        WHEEL_SIZE * scale +
        "px";

}


/* =====================================================
   НАШИ 4 КАМНЯ
===================================================== */

const gemImages = [

    "gem1.png",
    "gem2.png",
    "gem3.png",
    "gem4.png"

];


let gems = [];


/* =====================================================
   СОЗДАНИЕ КАМНЕЙ
===================================================== */

function createGems(){

    kaleidoscope.innerHTML = "";

    gems = [];


    /*
    4 кольца.
    Почти полностью заполняют круг.
    */

    const rings = [

        {
            count:7,
            radius:8,
            size:.95
        },

        {
            count:10,
            radius:21,
            size:.92
        },

        {
            count:14,
            radius:35,
            size:.84
        },

        {
            count:18,
            radius:47,
            size:.73
        }

    ];


    let globalIndex = 0;


    rings.forEach(
        (
            ring,
            ringIndex
        ) => {


            for(
                let i = 0;
                i < ring.count;
                i++
            ){

                const wrap =
                    document.createElement(
                        "div"
                    );


                wrap.className =
                    "gem-wrap";


                const img =
                    document.createElement(
                        "img"
                    );


                const type =
                    (
                        globalIndex %
                        4
                    ) + 1;


                img.src =
                    gemImages[
                        type - 1
                    ];


                img.className =
                    `gem type${type}`;


                img.draggable =
                    false;


                const shine =
                    document.createElement(
                        "div"
                    );


                shine.className =
                    "gem-shine";


                wrap.appendChild(
                    img
                );


                wrap.appendChild(
                    shine
                );


                kaleidoscope.appendChild(
                    wrap
                );


                const baseAngle =

                    (
                        360 /
                        ring.count
                    )

                    * i

                    +

                    ringIndex * 11;


                /*
                маленькая вариативность
                без полного хаоса
                */

                const angleOffset =
                    (
                        i % 2 === 0
                            ? 1
                            : -1
                    )

                    *

                    (
                        ringIndex * 2.5
                    );


                const radius =
                    ring.radius

                    +

                    (
                        (
                            i % 3
                        ) - 1
                    )

                    * 2;


                const scale =
                    ring.size

                    *

                    (
                        .88 +
                        (
                            i % 4
                        ) * .045
                    );


                wrap.dataset.angle =
                    baseAngle +
                    angleOffset;


                wrap.dataset.radius =
                    radius;


                wrap.dataset.scale =
                    scale;


                wrap.dataset.ring =
                    ringIndex;


                wrap.dataset.type =
                    type;


                wrap.dataset.phase =
                    (
                        globalIndex *
                        0.53
                    );


                gems.push({

                    wrap,
                    img,
                    shine

                });


                globalIndex++;

            }

        }

    );


    updateGems(
        0,
        0
    );

}


/* =====================================================
   ПОЗИЦИЯ И АНИМАЦИЯ
===================================================== */

function updateGems(
    progress,
    wheelRotation
){

    gems.forEach(
        (
            gem,
            index
        ) => {

            const wrap =
                gem.wrap;


            const img =
                gem.img;


            const shine =
                gem.shine;


            const angle =
                Number(
                    wrap.dataset.angle
                );


            const radius =
                Number(
                    wrap.dataset.radius
                );


            const baseScale =
                Number(
                    wrap.dataset.scale
                );


            const ring =
                Number(
                    wrap.dataset.ring
                );


            const type =
                Number(
                    wrap.dataset.type
                );


            const phase =
                Number(
                    wrap.dataset.phase
                );


            /*
            пока крутим —
            камни слегка перестраиваются
            */

            const restructure =
                Math.sin(
                    wheelRotation *
                    .018 +
                    phase
                )

                * 4.5;


            /*
            к концу они расходятся
            дальше наружу
            */

            const outward =
                progress *
                (
                    26 +
                    ring * 7
                );


            const currentRadius =
                radius +
                restructure +
                outward;


            const dynamicAngle =

                angle

                +

                Math.sin(
                    wheelRotation *
                    .013 +
                    phase
                )

                * 6

                +

                progress

                *

                (
                    ring % 2 === 0
                        ? 24
                        : -24
                );


            const rad =
                dynamicAngle *
                Math.PI /
                180;


            /*
            ВАЖНО:
            x/y задаются как % от круга.
            */

            const x =
                Math.cos(rad)
                *
                currentRadius;


            const y =
                Math.sin(rad)
                *
                currentRadius;


            /*
            маленькое дыхание
            */

            const pulse =
                1

                +

                Math.sin(
                    wheelRotation *
                    .025 +
                    phase
                )

                * .035;


            /*
            индивидуальный угол самого камня
            */

            const gemRotation =
                dynamicAngle

                +

                90

                +

                (
                    type === 2
                        ? 45
                        : 0
                )

                +

                Math.sin(
                    wheelRotation *
                    .02 +
                    phase
                )

                * 8;


            wrap.style.transform = `

                translate(
                    -50%,
                    -50%
                )

                translate(
                    ${x}%,
                    ${y}%
                )

            `;


            img.style.transform = `

                translate(
                    -50%,
                    -50%
                )

                rotate(
                    ${gemRotation}deg
                )

                scale(
                    ${
                        baseScale *
                        pulse *
                        (
                            1 -
                            progress * .18
                        )
                    }
                )

            `;


            /*
            ПЕРЕЛИВ
            */

            const brightness =

                1.03

                +

                Math.sin(
                    wheelRotation *
                    .03 +
                    phase
                )

                * .18;


            img.style.filter = `

                brightness(
                    ${brightness}
                )

                saturate(1.12)

                drop-shadow(
                    0 0
                    ${
                        6 +
                        Math.abs(
                            Math.sin(
                                phase +
                                wheelRotation *
                                .02
                            )
                        ) * 10
                    }px

                    rgba(
                        155,
                        110,
                        255,
                        .34
                    )
                )

            `;


            /*
            бегущий световой блик
            */

            shine.style.opacity =

                Math.max(
                    0,

                    Math.sin(
                        wheelRotation *
                        .028 +
                        phase
                    )

                )

                * .68;


            shine.style.transform = `

                translate(
                    -50%,
                    -50%
                )

                rotate(
                    ${
                        15 +
                        wheelRotation *
                        .14
                    }deg
                )

            `;


            /*
            к концу постепенно исчезают
            */

            let opacity =
                1;


            if(
                progress >
                .68
            ){

                opacity =
                    1 -

                    (
                        progress -
                        .68
                    )

                    /
                    .32;

            }


            wrap.style.opacity =
                Math.max(
                    0,
                    opacity
                );

        }

    );

}


/* =====================================================
   ВРАЩЕНИЕ
===================================================== */

let dragging =
    false;

let previousAngle =
    0;

let wheelRotation =
    0;

let totalRotation =
    0;

let finished =
    false;


const REQUIRED_ROTATION =
    450;


function pointerAngle(event){

    const rect =
        wheel.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    return Math.atan2(

        event.clientY -
        centerY,

        event.clientX -
        centerX

    )

    *

    180 /
    Math.PI;

}


/* =====================================================
   НАЧАЛО
===================================================== */

wheel.addEventListener(
    "pointerdown",
    event => {

        if(finished){
            return;
        }


        dragging =
            true;


        wheel.classList.add(
            "dragging"
        );


        previousAngle =
            pointerAngle(
                event
            );


        wheel.setPointerCapture(
            event.pointerId
        );


        hint.style.opacity =
            ".3";

    }
);


/* =====================================================
   ДВИЖЕНИЕ
===================================================== */

wheel.addEventListener(
    "pointermove",
    event => {

        if(
            !dragging ||
            finished
        ){
            return;
        }


        const currentAngle =
            pointerAngle(
                event
            );


        let delta =
            currentAngle -
            previousAngle;


        if(delta > 180){
            delta -= 360;
        }


        if(delta < -180){
            delta += 360;
        }


        previousAngle =
            currentAngle;


        wheelRotation +=
            delta;


        totalRotation +=
            Math.abs(delta);


        wheel.style.transform = `

            rotate(
                ${wheelRotation}deg
            )

        `;


        /*
        весь калейдоскоп
        тоже вращается
        */

        kaleidoscope.style.transform = `

            rotate(
                ${
                    wheelRotation *
                    .18
                }deg
            )

        `;


        const progress =
            Math.min(

                totalRotation /
                REQUIRED_ROTATION,

                1
            );


        updateGems(
            progress,
            wheelRotation
        );


        if(
            progress >= 1
        ){

            revealPicture();

        }

    }
);


/* =====================================================
   КОНЕЦ
===================================================== */

function stopDragging(){

    dragging =
        false;


    wheel.classList.remove(
        "dragging"
    );

}


wheel.addEventListener(
    "pointerup",
    stopDragging
);


wheel.addEventListener(
    "pointercancel",
    stopDragging
);


/* =====================================================
   ОТКРЫТИЕ КАРТИНКИ
===================================================== */

function revealPicture(){

    if(finished){
        return;
    }


    finished =
        true;


    hiddenPicture.classList.add(
        "visible"
    );


    hint.textContent =
        "Что ты увидел?";


    hint.style.opacity =
        "1";


    setTimeout(
        () => {

            next.classList.add(
                "visible"
            );

        },
        600
    );

}


/* =====================================================
   НОВЫЙ РАУНД
===================================================== */

function loadRound(){

    const round =
        rounds[
            roundIndex
        ];


    picture.textContent =
        round.emoji;


    hiddenPicture.classList.remove(
        "visible"
    );


    next.classList.remove(
        "visible"
    );


    hint.textContent =
        "Покрути волшебное колесо ✨";


    hint.style.opacity =
        "1";


    dragging =
        false;


    finished =
        false;


    totalRotation =
        0;


    wheelRotation =
        0;


    wheel.style.transform =
        "rotate(0deg)";


    kaleidoscope.style.transform =
        "rotate(0deg)";


    createGems();

}


/* =====================================================
   ДАЛЬШЕ
===================================================== */

next.addEventListener(
    "click",
    () => {

        roundIndex++;


        if(
            roundIndex >=
            rounds.length
        ){

            roundIndex =
                0;

        }


        loadRound();

    }
);


/* =====================================================
   СТАРТ
===================================================== */

background.addEventListener(
    "load",
    () => {

        positionElements();

        loadRound();

    }
);


window.addEventListener(
    "resize",
    positionElements
);


if(
    background.complete
){

    positionElements();

    loadRound();

}

</script>

</body>
</html>
