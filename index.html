<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Калейдоскоп — звук Ль</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070512;

    user-select:none;
    -webkit-user-select:none;

    touch-action:none;

    font-family:
        Arial,
        sans-serif;
}


/* =====================================================
   ИГРА
===================================================== */

.game{
    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;
}


/* =====================================================
   ФОН
===================================================== */

.background{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    z-index:1;

    pointer-events:none;
}


/* =====================================================
   ЛИНЗА
===================================================== */

.portal{
    position:absolute;

    border-radius:50%;

    overflow:hidden;

    z-index:5;

    pointer-events:none;
}


/* =====================================================
   СПРЯТАННАЯ КАРТИНКА
===================================================== */

.hidden-picture{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.45);

    opacity:0;

    z-index:2;

    transition:
        opacity .7s ease,
        transform .8s cubic-bezier(.2,.9,.3,1.2);
}


.hidden-picture.visible{
    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}


.picture{
    font-size:
        clamp(
            100px,
            17vw,
            230px
        );

    filter:
        drop-shadow(
            0 10px 15px
            rgba(0,0,0,.5)
        );
}


/* =====================================================
   КАЛЕЙДОСКОП
===================================================== */

.kaleidoscope{
    position:absolute;

    inset:0;

    z-index:5;

    transform-origin:
        50% 50%;

    will-change:
        transform;
}


/* =====================================================
   КОНТЕЙНЕР КАМНЯ
===================================================== */

.gem-wrap{
    position:absolute;

    width:16%;
    height:16%;

    pointer-events:none;

    transform:
        translate(
            -50%,
            -50%
        );

    transform-origin:
        50% 50%;

    will-change:
        left,
        top,
        opacity;
}


/* =====================================================
   PNG-КАМЕНЬ
===================================================== */

.gem{
    position:absolute;

    left:50%;
    top:50%;

    width:100%;
    height:100%;

    object-fit:contain;

    transform-origin:
        50% 50%;

    pointer-events:none;

    will-change:
        transform,
        filter;
}


/* =====================================================
   БЛИК НА КАМНЕ
===================================================== */

.gem-shine{
    position:absolute;

    left:50%;
    top:50%;

    width:30%;
    height:130%;

    transform:
        translate(-50%,-50%)
        rotate(25deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.65),
            transparent
        );

    opacity:0;

    filter:
        blur(4px);

    pointer-events:none;
}


/* =====================================================
   БЛИК НА ЛИНЗЕ
===================================================== */

.glass-shine{
    position:absolute;

    inset:0;

    z-index:20;

    border-radius:50%;

    pointer-events:none;

    background:

        radial-gradient(
            circle at 31% 20%,
            rgba(255,255,255,.13),
            transparent 24%
        ),

        radial-gradient(
            circle at center,
            transparent 69%,
            rgba(32,14,65,.18)
        );
}


/* =====================================================
   КОЛЕСО
===================================================== */

.wheel-wrap{
    position:absolute;

    z-index:30;

    display:flex;
    align-items:center;
    justify-content:center;
}


.wheel{
    width:100%;
    height:100%;

    object-fit:contain;

    cursor:grab;

    touch-action:none;

    transform-origin:
        50% 50%;

    filter:
        drop-shadow(
            0 10px 13px
            rgba(0,0,0,.5)
        );

    will-change:
        transform;
}


.wheel.dragging{
    cursor:grabbing;
}


/* =====================================================
   ПОДСКАЗКА
===================================================== */

.hint{
    position:absolute;

    left:50%;
    top:4%;

    transform:
        translateX(-50%);

    z-index:50;

    color:#fff;

    font-size:
        clamp(
            21px,
            2.3vw,
            35px
        );

    font-weight:700;

    white-space:nowrap;

    text-shadow:
        0 3px 8px
        rgba(0,0,0,.95);

    pointer-events:none;

    transition:
        opacity .3s ease;
}


/* =====================================================
   ДАЛЬШЕ
===================================================== */

.next{
    position:absolute;

    left:50%;
    bottom:4%;

    transform:
        translateX(-50%)
        scale(.8);

    z-index:60;

    padding:
        14px 34px;

    border:0;
    border-radius:23px;

    background:
        linear-gradient(
            #fff5c5,
            #ffd46a
        );

    color:#55346e;

    font-size:
        clamp(
            19px,
            2vw,
            27px
        );

    font-weight:800;

    box-shadow:
        0 6px 0 #a96c25,
        0 11px 20px rgba(0,0,0,.38);

    cursor:pointer;

    opacity:0;
    pointer-events:none;

    transition:
        opacity .35s ease,
        transform .35s ease;
}


.next.visible{
    opacity:1;
    pointer-events:auto;

    transform:
        translateX(-50%)
        scale(1);
}

</style>

</head>


<body>


<div
    class="game"
    id="game"
>


    <!-- ФОН -->

    <img
        src="fon.png"
        class="background"
        id="background"
        alt=""
    >



    <!-- ПОДСКАЗКА -->

    <div
        class="hint"
        id="hint"
    >
        Покрути волшебное колесо ✨
    </div>



    <!-- ЛИНЗА -->

    <div
        class="portal"
        id="portal"
    >


        <!-- СПРЯТАННАЯ КАРТИНКА -->

        <div
            class="hidden-picture"
            id="hiddenPicture"
        >

            <div
                class="picture"
                id="picture"
            >
                🦁
            </div>

        </div>



        <!-- КАМУШКИ -->

        <div
            class="kaleidoscope"
            id="kaleidoscope"
        ></div>



        <!-- БЛИК -->

        <div
            class="glass-shine"
        ></div>


    </div>



    <!-- КОЛЕСО -->

    <div
        class="wheel-wrap"
        id="wheelWrap"
    >

        <img
            src="wheel.png"
            class="wheel"
            id="wheel"
            draggable="false"
            alt=""
        >

    </div>



    <!-- КНОПКА -->

    <button
        class="next"
        id="next"
    >
        Дальше →
    </button>


</div>



<script>


/* =====================================================
   РАУНДЫ
===================================================== */

const rounds = [

    { emoji:"🦁" },

    { emoji:"🦊" },

    { emoji:"🍋" },

    { emoji:"🦢" },

    { emoji:"🍃" }

];


let roundIndex = 0;


/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const game =
    document.getElementById(
        "game"
    );


const background =
    document.getElementById(
        "background"
    );


const portal =
    document.getElementById(
        "portal"
    );


const kaleidoscope =
    document.getElementById(
        "kaleidoscope"
    );


const wheelWrap =
    document.getElementById(
        "wheelWrap"
    );


const wheel =
    document.getElementById(
        "wheel"
    );


const hiddenPicture =
    document.getElementById(
        "hiddenPicture"
    );


const picture =
    document.getElementById(
        "picture"
    );


const hint =
    document.getElementById(
        "hint"
    );


const next =
    document.getElementById(
        "next"
    );


/* =====================================================
   РАЗМЕР ИСХОДНОГО ФОНА
===================================================== */

const DESIGN_WIDTH =
    1536;


const DESIGN_HEIGHT =
    1024;


/* =====================================================
   КООРДИНАТЫ ЛИНЗЫ
===================================================== */

const PORTAL_X =
    337;


const PORTAL_Y =
    105;


const PORTAL_SIZE =
    660;


/* =====================================================
   КООРДИНАТЫ КОЛЕСА
===================================================== */

const WHEEL_X =
    1065;


const WHEEL_Y =
    490;


const WHEEL_SIZE =
    280;


/* =====================================================
   ПОЗИЦИОНИРОВАНИЕ
===================================================== */

function positionElements(){

    const screenW =
        game.clientWidth;


    const screenH =
        game.clientHeight;


    const scale =
        Math.max(

            screenW /
            DESIGN_WIDTH,

            screenH /
            DESIGN_HEIGHT

        );


    const renderedW =
        DESIGN_WIDTH *
        scale;


    const renderedH =
        DESIGN_HEIGHT *
        scale;


    const cropX =
        (
            screenW -
            renderedW
        ) / 2;


    const cropY =
        (
            screenH -
            renderedH
        ) / 2;



    portal.style.left =

        PORTAL_X *
        scale +

        cropX +

        "px";


    portal.style.top =

        PORTAL_Y *
        scale +

        cropY +

        "px";


    portal.style.width =

        PORTAL_SIZE *
        scale +

        "px";


    portal.style.height =

        PORTAL_SIZE *
        scale +

        "px";



    wheelWrap.style.left =

        WHEEL_X *
        scale +

        cropX +

        "px";


    wheelWrap.style.top =

        WHEEL_Y *
        scale +

        cropY +

        "px";


    wheelWrap.style.width =

        WHEEL_SIZE *
        scale +

        "px";


    wheelWrap.style.height =

        WHEEL_SIZE *
        scale +

        "px";

}


/* =====================================================
   4 PNG-КАМНЯ
===================================================== */

const gemImages = [

    "gem1.png",

    "gem2.png",

    "gem3.png",

    "gem4.png"

];


let gems = [];


/* =====================================================
   СОЗДАЁМ 80 КАМНЕЙ
===================================================== */

function createGems(){

    kaleidoscope.innerHTML =
        "";


    gems = [];


    /*
    5 колец.
    Заполняем почти всю линзу.
    */

    const rings = [

        {
            count:8,
            radius:7,
            size:1.30
        },

        {
            count:12,
            radius:17,
            size:1.20
        },

        {
            count:16,
            radius:29,
            size:1.08
        },

        {
            count:20,
            radius:40,
            size:.98
        },

        {
            count:24,
            radius:48,
            size:.82
        }

    ];


    let globalIndex =
        0;


    rings.forEach(
        (
            ring,
            ringIndex
        ) => {


            for(
                let i = 0;
                i < ring.count;
                i++
            ){


                /* -------------------------
                   КОНТЕЙНЕР
                ------------------------- */

                const wrap =
                    document.createElement(
                        "div"
                    );


                wrap.className =
                    "gem-wrap";


                /* -------------------------
                   PNG
                ------------------------- */

                const img =
                    document.createElement(
                        "img"
                    );


                const type =

                    (
                        globalIndex %
                        4
                    )

                    + 1;


                img.src =

                    gemImages[
                        type - 1
                    ];


                img.className =
                    "gem";


                img.draggable =
                    false;


                /* -------------------------
                   БЛИК
                ------------------------- */

                const shine =
                    document.createElement(
                        "div"
                    );


                shine.className =
                    "gem-shine";


                wrap.appendChild(
                    img
                );


                wrap.appendChild(
                    shine
                );


                kaleidoscope.appendChild(
                    wrap
                );


                /* -------------------------
                   УГОЛ
                ------------------------- */

                const angle =

                    (
                        360 /
                        ring.count
                    )

                    * i

                    +

                    ringIndex * 8.5;


                /* -------------------------
                   МАЛЕНЬКАЯ ВАРИАЦИЯ
                ------------------------- */

                const radiusVariation =

                    (
                        (
                            i % 3
                        ) - 1
                    )

                    * 1.3;


                const scaleVariation =

                    .9

                    +

                    (
                        i % 4
                    )

                    * .04;


                wrap.dataset.angle =
                    angle;


                wrap.dataset.radius =

                    ring.radius +
                    radiusVariation;


                wrap.dataset.scale =

                    ring.size *
                    scaleVariation;


                wrap.dataset.ring =
                    ringIndex;


                wrap.dataset.type =
                    type;


                wrap.dataset.phase =

                    globalIndex *
                    .67;


                gems.push({

                    wrap,
                    img,
                    shine

                });


                globalIndex++;

            }

        }

    );


    updateGems(
        0,
        0
    );

}


/* =====================================================
   АНИМАЦИЯ КАМНЕЙ
===================================================== */

function updateGems(
    progress,
    wheelRotation
){

    gems.forEach(
        (
            gem,
            index
        ) => {


            const wrap =
                gem.wrap;


            const img =
                gem.img;


            const shine =
                gem.shine;


            const angle =
                Number(
                    wrap.dataset.angle
                );


            const radius =
                Number(
                    wrap.dataset.radius
                );


            const baseScale =
                Number(
                    wrap.dataset.scale
                );


            const ring =
                Number(
                    wrap.dataset.ring
                );


            const type =
                Number(
                    wrap.dataset.type
                );


            const phase =
                Number(
                    wrap.dataset.phase
                );


            /* =========================================
               НЕБОЛЬШОЕ ДВИЖЕНИЕ ПО РАДИУСУ
            ========================================= */

            const movement =

                Math.sin(

                    wheelRotation *
                    .022 +

                    phase

                )

                * 1.8;


            let currentRadius =

                radius +
                movement;


            /* =========================================
               В КОНЦЕ ОСВОБОЖДАЕМ ЦЕНТР
            ========================================= */

            if(
                progress >
                .72
            ){

                const opening =

                    (
                        progress -
                        .72
                    )

                    /

                    .28;


                /*
                Максимум 47,
                чтобы крупные камни
                не вылезали за рамку.
                */

                const safeOuterRadius =
                    47;


                currentRadius =

                    currentRadius

                    +

                    (
                        safeOuterRadius -
                        currentRadius
                    )

                    *

                    opening;

            }


            /* =========================================
               ПЕРЕСТРОЕНИЕ ПО УГЛУ
            ========================================= */

            const angularMovement =

                Math.sin(

                    wheelRotation *
                    .018 +

                    phase

                )

                * 5;


            const currentAngle =

                angle +
                angularMovement;


            const rad =

                currentAngle

                *

                Math.PI /
                180;


            const x =

                50 +

                Math.cos(rad) *
                currentRadius;


            const y =

                50 +

                Math.sin(rad) *
                currentRadius;


            wrap.style.left =
                x + "%";


            wrap.style.top =
                y + "%";


            /* =========================================
               ВРАЩЕНИЕ САМОГО КАМНЯ
            ========================================= */

            const personalDirection =

                index % 2 === 0
                    ? 1
                    : -1;


            const gemRotation =

                currentAngle

                +

                90

                +

                wheelRotation *
                .13 *
                personalDirection

                +

                Math.sin(
                    phase +
                    wheelRotation *
                    .024
                )

                * 9;


            /* =========================================
               ДЫХАНИЕ
            ========================================= */

            const pulse =

                1

                +

                Math.sin(

                    phase +

                    wheelRotation *
                    .03

                )

                * .045;


            /*
            во время открытия
            немного уменьшаем
            */

            const openingScale =

                1 -
                progress * .08;


            img.style.transform = `

                translate(
                    -50%,
                    -50%
                )

                rotate(
                    ${gemRotation}deg
                )

                scale(
                    ${
                        baseScale *
                        pulse *
                        openingScale
                    }
                )

            `;


            /* =========================================
               ПЕРЕЛИВ
            ========================================= */

            const shimmer =

                Math.sin(

                    phase +

                    wheelRotation *
                    .037

                );


            const brightness =

                1.07 +

                shimmer *
                .16;


            const glow =

                5 +

                Math.abs(
                    shimmer
                )

                * 11;


            img.style.filter = `

                brightness(
                    ${brightness}
                )

                saturate(1.16)

                drop-shadow(
                    0 0
                    ${glow}px
                    rgba(
                        160,
                        115,
                        255,
                        .4
                    )
                )

            `;


            /* =========================================
               БЛИК
            ========================================= */

            shine.style.opacity =

                Math.max(
                    0,
                    shimmer
                )

                * .55;


            shine.style.transform = `

                translate(
                    -50%,
                    -50%
                )

                rotate(
                    ${
                        20 +
                        wheelRotation *
                        .1
                    }deg
                )

            `;


            /* =========================================
               ИСЧЕЗНОВЕНИЕ
            ========================================= */

            let opacity =
                1;


            if(
                progress >
                .80
            ){

                opacity =

                    1 -

                    (
                        progress -
                        .80
                    )

                    /

                    .20;

            }


            wrap.style.opacity =

                Math.max(
                    0,
                    opacity
                );

        }

    );

}


/* =====================================================
   СОСТОЯНИЕ ВРАЩЕНИЯ
===================================================== */

let dragging =
    false;


let previousAngle =
    0;


let wheelRotation =
    0;


let totalRotation =
    0;


let finished =
    false;


/*
1.25 оборота
*/

const REQUIRED_ROTATION =
    450;


/* =====================================================
   УГОЛ УКАЗАТЕЛЯ
===================================================== */

function pointerAngle(
    event
){

    const rect =
        wheel.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    return Math.atan2(

        event.clientY -
        centerY,

        event.clientX -
        centerX

    )

    *

    180 /
    Math.PI;

}


/* =====================================================
   НАЧАЛО ВРАЩЕНИЯ
===================================================== */

wheel.addEventListener(
    "pointerdown",

    event => {


        if(
            finished
        ){
            return;
        }


        dragging =
            true;


        wheel.classList.add(
            "dragging"
        );


        previousAngle =
            pointerAngle(
                event
            );


        wheel.setPointerCapture(
            event.pointerId
        );


        hint.style.opacity =
            ".3";

    }
);


/* =====================================================
   ВРАЩЕНИЕ
===================================================== */

wheel.addEventListener(
    "pointermove",

    event => {


        if(
            !dragging ||
            finished
        ){
            return;
        }


        const currentAngle =
            pointerAngle(
                event
            );


        let delta =

            currentAngle -
            previousAngle;


        /*
        переход через
        -180 / +180
        */

        if(
            delta >
            180
        ){

            delta -=
                360;

        }


        if(
            delta <
            -180
        ){

            delta +=
                360;

        }


        previousAngle =
            currentAngle;


        wheelRotation +=
            delta;


        totalRotation +=
            Math.abs(
                delta
            );


        /* -------------------------
           КРУТИМ КОЛЕСО
        ------------------------- */

        wheel.style.transform = `

            rotate(
                ${wheelRotation}deg
            )

        `;


        /* -------------------------
           КРУТИМ ВЕСЬ УЗОР
        ------------------------- */

        kaleidoscope.style.transform = `

            rotate(
                ${
                    wheelRotation *
                    .16
                }deg
            )

        `;


        const progress =
            Math.min(

                totalRotation /
                REQUIRED_ROTATION,

                1

            );


        updateGems(
            progress,
            wheelRotation
        );


        if(
            progress >=
            1
        ){

            revealPicture();

        }

    }
);


/* =====================================================
   КОНЕЦ ВРАЩЕНИЯ
===================================================== */

function stopDragging(){

    dragging =
        false;


    wheel.classList.remove(
        "dragging"
    );

}


wheel.addEventListener(
    "pointerup",
    stopDragging
);


wheel.addEventListener(
    "pointercancel",
    stopDragging
);


/* =====================================================
   ПОКАЗ КАРТИНКИ
===================================================== */

function revealPicture(){

    if(
        finished
    ){
        return;
    }


    finished =
        true;


    hiddenPicture.classList.add(
        "visible"
    );


    hint.textContent =
        "Что ты увидел?";


    hint.style.opacity =
        "1";


    setTimeout(
        () => {

            next.classList.add(
                "visible"
            );

        },
        600
    );

}


/* =====================================================
   НОВЫЙ РАУНД
===================================================== */

function loadRound(){

    const round =
        rounds[
            roundIndex
        ];


    picture.textContent =
        round.emoji;


    hiddenPicture.classList.remove(
        "visible"
    );


    next.classList.remove(
        "visible"
    );


    hint.textContent =
        "Покрути волшебное колесо ✨";


    hint.style.opacity =
        "1";


    dragging =
        false;


    finished =
        false;


    totalRotation =
        0;


    wheelRotation =
        0;


    wheel.style.transform =
        "rotate(0deg)";


    kaleidoscope.style.transform =
        "rotate(0deg)";


    createGems();

}


/* =====================================================
   ДАЛЬШЕ
===================================================== */

next.addEventListener(
    "click",

    () => {


        roundIndex++;


        if(
            roundIndex >=
            rounds.length
        ){

            roundIndex =
                0;

        }


        loadRound();

    }
);


/* =====================================================
   СТАРТ
===================================================== */

background.addEventListener(
    "load",

    () => {

        positionElements();

        loadRound();

    }
);


window.addEventListener(
    "resize",
    positionElements
);


/*
если фон уже
загружен из кэша
*/

if(
    background.complete
){

    positionElements();

    loadRound();

}

</script>


</body>

</html>
