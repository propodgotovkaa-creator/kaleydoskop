<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Калейдоскоп — звук Ль</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    -webkit-tap-highlight-color:
        transparent;
}


html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#070512;

    user-select:none;
    -webkit-user-select:none;

    touch-action:none;

    font-family:
        Arial,
        sans-serif;
}


/* =====================================================
   ИГРА
===================================================== */

.game{

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;
}


/* =====================================================
   ФОН

   ВАЖНО:
   отдельным img, чтобы мы могли точно вычислять,
   где находится линза после object-fit:cover
===================================================== */

.background{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    object-fit:cover;

    object-position:center center;

    pointer-events:none;

    z-index:1;
}


/* =====================================================
   ВНУТРЕННЯЯ ОБЛАСТЬ КАЛЕЙДОСКОПА

   НИКАКОГО ФОНА ЗДЕСЬ НЕТ.

   Видно настоящий темный круг,
   который уже нарисован в fon.png.
===================================================== */

.portal{

    position:absolute;

    border-radius:50%;

    overflow:hidden;

    z-index:5;

    pointer-events:none;
}


/* =====================================================
   КАРТИНКА
===================================================== */

.hidden-picture{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.45);

    opacity:0;

    z-index:2;

    transition:
        opacity .65s ease,
        transform .8s cubic-bezier(.2,.9,.3,1.2);
}


.hidden-picture.visible{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}


.picture{

    font-size:
        clamp(
            100px,
            17vw,
            230px
        );

    filter:
        drop-shadow(
            0 10px 15px
            rgba(0,0,0,.5)
        );
}


/* =====================================================
   КАМУШКИ
===================================================== */

.kaleidoscope{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    transform-origin:
        50% 50%;

    z-index:5;

    will-change:
        transform;
}


/* отдельный камушек */

.gem{

    position:absolute;

    left:50%;
    top:50%;

    width:13%;
    height:18%;

    transform-origin:
        50% 50%;

    opacity:.94;

    will-change:
        transform,
        opacity;

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,255,255,.16)
        );
}


/* сам кристалл */

.gem-shape{

    width:100%;
    height:100%;

    clip-path:
        polygon(
            50% 0%,
            100% 36%,
            77% 100%,
            23% 100%,
            0% 36%
        );

    border-radius:8%;

    box-shadow:

        inset 0 0 12px
        rgba(255,255,255,.5),

        inset 8px 3px 13px
        rgba(255,255,255,.18);
}


/* внутренний блеск */

.gem-shape::before{

    content:"";

    position:absolute;

    inset:15%;

    clip-path:
        polygon(
            50% 0%,
            100% 42%,
            65% 100%,
            35% 100%,
            0% 42%
        );

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.5),
            rgba(255,255,255,.02)
        );

    opacity:.6;
}


/* световая точка */

.gem-shape::after{

    content:"";

    position:absolute;

    width:22%;
    height:22%;

    left:18%;
    top:17%;

    border-radius:50%;

    background:
        rgba(255,255,255,.8);

    filter:
        blur(3px);
}


/* =====================================================
   ЦЕНТРАЛЬНАЯ ЗВЕЗДА КАЛЕЙДОСКОПА
===================================================== */

.center-star{

    position:absolute;

    left:50%;
    top:50%;

    width:22%;
    aspect-ratio:1;

    transform:
        translate(-50%,-50%);

    z-index:7;

    opacity:.82;

    background:

        conic-gradient(
            #ff48c7,
            #614cff,
            #35d9ff,
            #4dffbd,
            #ffd84a,
            #ff6cae,
            #ff48c7
        );

    clip-path:
        polygon(
            50% 0%,
            60% 37%,
            100% 50%,
            60% 63%,
            50% 100%,
            40% 63%,
            0% 50%,
            40% 37%
        );

    filter:
        drop-shadow(
            0 0 18px
            rgba(180,90,255,.8)
        );

    transition:
        opacity .4s ease,
        transform .4s ease;
}


/* =====================================================
   СТЕКЛЯННЫЙ БЛИК
===================================================== */

.glass-shine{

    position:absolute;

    inset:0;

    border-radius:50%;

    pointer-events:none;

    z-index:15;

    background:

        radial-gradient(
            circle at 32% 23%,
            rgba(255,255,255,.12),
            transparent 24%
        );

}


/* =====================================================
   КОЛЕСО
===================================================== */

.wheel-wrap{

    position:absolute;

    z-index:30;

    display:flex;

    align-items:center;
    justify-content:center;
}


.wheel{

    width:100%;
    height:100%;

    object-fit:contain;

    cursor:grab;

    touch-action:none;

    transform-origin:
        50% 50%;

    filter:

        drop-shadow(
            0 10px 13px
            rgba(0,0,0,.48)
        );

    will-change:
        transform;
}


.wheel.dragging{

    cursor:grabbing;
}


/* =====================================================
   ПОДСКАЗКА
===================================================== */

.hint{

    position:absolute;

    left:50%;
    top:4%;

    transform:
        translateX(-50%);

    z-index:50;

    color:#fff;

    font-size:
        clamp(
            21px,
            2.3vw,
            35px
        );

    font-weight:700;

    white-space:nowrap;

    text-shadow:

        0 3px 7px
        rgba(0,0,0,.9);

    pointer-events:none;

    transition:
        opacity .3s ease;
}


/* =====================================================
   ДАЛЬШЕ
===================================================== */

.next{

    position:absolute;

    left:50%;
    bottom:4%;

    transform:
        translateX(-50%)
        scale(.8);

    z-index:60;

    padding:
        14px 34px;

    border:0;

    border-radius:23px;

    background:

        linear-gradient(
            #fff6c6,
            #ffd86a
        );

    color:#54346f;

    font-size:
        clamp(
            19px,
            2vw,
            27px
        );

    font-weight:800;

    box-shadow:

        0 6px 0
        #a96924,

        0 10px 20px
        rgba(0,0,0,.35);

    cursor:pointer;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .35s ease,
        transform .35s ease;
}


.next.visible{

    opacity:1;

    pointer-events:auto;

    transform:
        translateX(-50%)
        scale(1);
}


</style>

</head>


<body>


<div
    class="game"
    id="game"
>


    <!-- ФОН -->

    <img
        src="fon.png"
        class="background"
        id="background"
        alt=""
    >



    <!-- ПОДСКАЗКА -->

    <div
        class="hint"
        id="hint"
    >
        Покрути волшебное колесо ✨
    </div>



    <!-- ВНУТРЕННОСТЬ НАРИСОВАННОЙ ЛИНЗЫ -->

    <div
        class="portal"
        id="portal"
    >


        <!-- СПРЯТАННАЯ КАРТИНКА -->

        <div
            class="hidden-picture"
            id="hiddenPicture"
        >

            <div
                class="picture"
                id="picture"
            >
                🦁
            </div>

        </div>



        <!-- УЗОР КАЛЕЙДОСКОПА -->

        <div
            class="kaleidoscope"
            id="kaleidoscope"
        >

            <div
                class="center-star"
                id="centerStar"
            ></div>

        </div>



        <div
            class="glass-shine"
        ></div>


    </div>



    <!-- КОЛЕСО -->

    <div
        class="wheel-wrap"
        id="wheelWrap"
    >

        <img
            src="wheel.png"
            class="wheel"
            id="wheel"
            draggable="false"
            alt=""
        >

    </div>



    <!-- ДАЛЬШЕ -->

    <button
        class="next"
        id="next"
    >
        Дальше →
    </button>


</div>



<script>

/* =====================================================
   РАУНДЫ
===================================================== */

const rounds = [

    {
        emoji:"🦁"
    },

    {
        emoji:"🦊"
    },

    {
        emoji:"🍋"
    },

    {
        emoji:"🦢"
    },

    {
        emoji:"🍃"
    }

];


let roundIndex = 0;


/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const game =
    document.getElementById(
        "game"
    );


const background =
    document.getElementById(
        "background"
    );


const portal =
    document.getElementById(
        "portal"
    );


const kaleidoscope =
    document.getElementById(
        "kaleidoscope"
    );


const wheelWrap =
    document.getElementById(
        "wheelWrap"
    );


const wheel =
    document.getElementById(
        "wheel"
    );


const hiddenPicture =
    document.getElementById(
        "hiddenPicture"
    );


const picture =
    document.getElementById(
        "picture"
    );


const centerStar =
    document.getElementById(
        "centerStar"
    );


const hint =
    document.getElementById(
        "hint"
    );


const next =
    document.getElementById(
        "next"
    );



/* =====================================================
   КООРДИНАТЫ НА ИСХОДНОМ FON.PNG

   Наша картинка:
   1536 × 1024

   Мы указываем место внутренней тёмной линзы
   непосредственно на исходной картинке.
===================================================== */

const DESIGN_WIDTH =
    1536;


const DESIGN_HEIGHT =
    1024;


/*
   внутренняя линза
*/

const PORTAL_X =
    337;


const PORTAL_Y =
    105;


const PORTAL_SIZE =
    660;


/*
   колесо

   это координаты отдельного wheel.png
   поверх фона
*/

const WHEEL_X =
    1065;


const WHEEL_Y =
    490;


const WHEEL_SIZE =
    280;



/* =====================================================
   ТОЧНОЕ ПОЗИЦИОНИРОВАНИЕ ПРИ OBJECT-FIT:COVER

   Поэтому элементы не съезжают
   на широком экране.
===================================================== */

function positionElements(){

    const screenW =
        game.clientWidth;


    const screenH =
        game.clientHeight;


    /*
    object-fit:cover
    */

    const scale =
        Math.max(

            screenW /
            DESIGN_WIDTH,

            screenH /
            DESIGN_HEIGHT

        );


    const renderedW =
        DESIGN_WIDTH *
        scale;


    const renderedH =
        DESIGN_HEIGHT *
        scale;


    /*
    фон обрезается одинаково
    с двух сторон
    */

    const cropX =
        (
            screenW -
            renderedW
        ) / 2;


    const cropY =
        (
            screenH -
            renderedH
        ) / 2;



    /* -----------------------------
       ЛИНЗА
    ----------------------------- */

    portal.style.left =
        (
            PORTAL_X *
            scale +
            cropX
        ) + "px";


    portal.style.top =
        (
            PORTAL_Y *
            scale +
            cropY
        ) + "px";


    portal.style.width =
        (
            PORTAL_SIZE *
            scale
        ) + "px";


    portal.style.height =
        (
            PORTAL_SIZE *
            scale
        ) + "px";



    /* -----------------------------
       КОЛЕСО
    ----------------------------- */

    wheelWrap.style.left =
        (
            WHEEL_X *
            scale +
            cropX
        ) + "px";


    wheelWrap.style.top =
        (
            WHEEL_Y *
            scale +
            cropY
        ) + "px";


    wheelWrap.style.width =
        (
            WHEEL_SIZE *
            scale
        ) + "px";


    wheelWrap.style.height =
        (
            WHEEL_SIZE *
            scale
        ) + "px";

}


/* =====================================================
   ЦВЕТА КАМУШКОВ
===================================================== */

const gemColors = [

    ["#ff43c4","#7d31ff"],

    ["#28d9ff","#375cff"],

    ["#26ffd1","#008f94"],

    ["#ffe05d","#ff793d"],

    ["#ff6fcf","#ae35ff"],

    ["#42d7ff","#00a6ff"],

    ["#a964ff","#5e39d8"],

    ["#77ff8a","#16b27e"]

];



let gems = [];


/* =====================================================
   СОЗДАЁМ КРАСИВЫЙ СИММЕТРИЧНЫЙ УЗОР

   Не случайная куча.
   Несколько колец камней.
===================================================== */

function createGems(){

    /*
    удаляем старые камушки
    */

    kaleidoscope
        .querySelectorAll(
            ".gem"
        )
        .forEach(
            element =>
                element.remove()
        );


    gems = [];


    /*
    Кольца:
    количество камушков,
    радиус,
    размер
    */

    const rings = [

        {
            count:8,
            radius:18,
            scale:.78
        },

        {
            count:12,
            radius:31,
            scale:.9
        },

        {
            count:16,
            radius:43,
            scale:.75
        }

    ];


    rings.forEach(
        (
            ring,
            ringIndex
        ) => {


            for(
                let i = 0;
                i < ring.count;
                i++
            ){

                const gem =
                    document.createElement(
                        "div"
                    );


                gem.className =
                    "gem";


                const shape =
                    document.createElement(
                        "div"
                    );


                shape.className =
                    "gem-shape";


                const colors =
                    gemColors[
                        (
                            i +
                            ringIndex * 2
                        )
                        %
                        gemColors.length
                    ];


                shape.style.background = `

                    linear-gradient(
                        ${
                            40 +
                            i * 23
                        }deg,

                        ${colors[0]},

                        ${colors[1]}
                    )

                `;


                gem.appendChild(
                    shape
                );


                const angle =

                    (
                        360 /
                        ring.count
                    )

                    * i

                    +

                    ringIndex * 10;



                gem.dataset.angle =
                    angle;


                gem.dataset.radius =
                    ring.radius;


                gem.dataset.baseScale =
                    ring.scale;


                gem.dataset.ring =
                    ringIndex;


                kaleidoscope.appendChild(
                    gem
                );


                gems.push(
                    gem
                );

            }

        }

    );


    updateGems(0);

}



/* =====================================================
   ОБНОВЛЕНИЕ КАМУШКОВ

   progress:
   0 = узор закрывает центр
   1 = камни разошлись
===================================================== */

function updateGems(progress){

    gems.forEach(
        (
            gem,
            index
        ) => {


            const angle =
                Number(
                    gem.dataset.angle
                );


            const radius =
                Number(
                    gem.dataset.radius
                );


            const baseScale =
                Number(
                    gem.dataset.baseScale
                );


            const ring =
                Number(
                    gem.dataset.ring
                );


            /*
            В начале расположены
            красивыми кольцами.
            */

            const startDistance =
                radius;


            /*
            Потом расходятся
            к краям линзы.
            */

            const finishDistance =

                68

                +

                ring * 11;


            const distance =

                startDistance

                +

                (
                    finishDistance -
                    startDistance
                )

                * progress;



            /*
            Дополнительное вращение
            */

            const extraRotation =

                progress

                *

                (
                    ring % 2 === 0
                        ? 120
                        : -120
                );


            /*
            Переводим процент радиуса
            в CSS.
            */

            const rad =
                (
                    angle +
                    extraRotation
                )

                *
                Math.PI /
                180;


            const x =
                Math.cos(rad)
                *
                distance;


            const y =
                Math.sin(rad)
                *
                distance;



            gem.style.transform = `

                translate(
                    -50%,
                    -50%
                )

                translate(
                    ${x}%,
                    ${y}%
                )

                rotate(
                    ${
                        angle +
                        extraRotation +
                        90
                    }deg
                )

                scale(
                    ${
                        baseScale *
                        (
                            1 -
                            progress * .25
                        )
                    }
                )

            `;



            /*
            Камни не исчезают сразу.

            Сначала расходятся,
            затем становятся прозрачными.
            */

            let opacity = 1;


            if(
                progress >
                .56
            ){

                opacity =
                    1 -

                    (
                        progress -
                        .56
                    )

                    /
                    .44;

            }


            gem.style.opacity =
                Math.max(
                    0,
                    opacity
                );

        }

    );



    /*
    центральная звезда
    */

    centerStar.style.opacity =

        Math.max(
            0,
            1 -
            progress * 1.45
        );


    centerStar.style.transform = `

        translate(
            -50%,
            -50%
        )

        rotate(
            ${progress * 250}deg
        )

        scale(
            ${
                1 +
                progress * .4
            }
        )

    `;

}



/* =====================================================
   ВРАЩЕНИЕ КОЛЕСА
===================================================== */

let dragging =
    false;


let previousAngle =
    0;


let wheelRotation =
    0;


let accumulatedRotation =
    0;


let finished =
    false;


/*
1.25 оборота
*/

const REQUIRED_ROTATION =
    450;



function pointerAngle(event){

    const rect =
        wheel.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    return Math.atan2(

        event.clientY -
        centerY,

        event.clientX -
        centerX

    )

    *

    180 /
    Math.PI;

}



/* =====================================================
   НАЧАЛИ КРУТИТЬ
===================================================== */

wheel.addEventListener(
    "pointerdown",

    event => {

        if(finished){
            return;
        }


        dragging =
            true;


        wheel.classList.add(
            "dragging"
        );


        previousAngle =
            pointerAngle(
                event
            );


        wheel.setPointerCapture(
            event.pointerId
        );


        hint.style.opacity =
            ".3";

    }
);



/* =====================================================
   КРУТИМ
===================================================== */

wheel.addEventListener(
    "pointermove",

    event => {

        if(
            !dragging ||
            finished
        ){
            return;
        }


        const currentAngle =
            pointerAngle(
                event
            );


        let delta =
            currentAngle -
            previousAngle;


        /*
        переход через 180°
        */

        if(delta > 180){

            delta -= 360;

        }


        if(delta < -180){

            delta += 360;

        }


        previousAngle =
            currentAngle;


        wheelRotation +=
            delta;


        accumulatedRotation +=
            Math.abs(
                delta
            );


        /*
        крутим настоящее колесо
        */

        wheel.style.transform = `

            rotate(
                ${wheelRotation}deg
            )

        `;



        /*
        узор тоже двигается,
        но немного медленнее
        */

        kaleidoscope.style.transform = `

            rotate(
                ${
                    wheelRotation *
                    .42
                }deg
            )

        `;



        const progress =
            Math.min(

                accumulatedRotation /
                REQUIRED_ROTATION,

                1
            );


        updateGems(
            progress
        );


        if(
            progress >= 1
        ){

            revealPicture();

        }

    }
);



function stopDrag(){

    dragging =
        false;


    wheel.classList.remove(
        "dragging"
    );

}


wheel.addEventListener(
    "pointerup",
    stopDrag
);


wheel.addEventListener(
    "pointercancel",
    stopDrag
);



/* =====================================================
   ОТКРЫВАЕМ КАРТИНКУ
===================================================== */

function revealPicture(){

    if(finished){
        return;
    }


    finished =
        true;


    hiddenPicture.classList.add(
        "visible"
    );


    hint.textContent =
        "Что ты увидел?";


    hint.style.opacity =
        "1";


    setTimeout(
        () => {

            next.classList.add(
                "visible"
            );

        },

        600
    );

}



/* =====================================================
   НОВЫЙ РАУНД
===================================================== */

function loadRound(){

    const round =
        rounds[
            roundIndex
        ];


    picture.textContent =
        round.emoji;


    hiddenPicture.classList.remove(
        "visible"
    );


    next.classList.remove(
        "visible"
    );


    hint.textContent =
        "Покрути волшебное колесо ✨";


    hint.style.opacity =
        "1";


    dragging =
        false;


    finished =
        false;


    accumulatedRotation =
        0;


    wheelRotation =
        0;


    wheel.style.transform =
        "rotate(0deg)";


    kaleidoscope.style.transform =
        "rotate(0deg)";


    createGems();

}



/* =====================================================
   ДАЛЬШЕ
===================================================== */

next.addEventListener(
    "click",

    () => {

        roundIndex++;


        if(
            roundIndex >=
            rounds.length
        ){

            roundIndex =
                0;

        }


        loadRound();

    }
);



/* =====================================================
   СТАРТ
===================================================== */

background.addEventListener(
    "load",

    () => {

        positionElements();

        loadRound();

    }
);


window.addEventListener(
    "resize",
    positionElements
);


/*
если изображение уже в кеше
*/

if(
    background.complete
){

    positionElements();

    loadRound();

}

</script>


</body>

</html>
