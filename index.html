<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Калейдоскоп — звук Ль</title>


<!-- =====================================================
     ШРИФТ CORMORANT SC
===================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&display=swap"
    rel="stylesheet"
>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    -webkit-tap-highlight-color:
        transparent;
}


html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#070512;

    user-select:none;
    -webkit-user-select:none;

    touch-action:none;

    font-family:
        "Cormorant SC",
        serif;
}


/* =====================================================
   ОСНОВА
===================================================== */

.game{

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;
}


/* =====================================================
   ФОН
===================================================== */

.background{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    z-index:1;

    pointer-events:none;
}


/* =====================================================
   БОЛЬШОЙ КРУГ
===================================================== */

.portal{

    position:absolute;

    border-radius:50%;

    overflow:hidden;

    z-index:5;

    pointer-events:none;
}


/* =====================================================
   КАРТИНКА РАУНДА
===================================================== */

.hidden-picture{

    position:absolute;

    left:50%;
    top:50%;

    width:56%;
    height:56%;

    display:flex;

    align-items:center;
    justify-content:center;

    transform:
        translate(-50%,-50%)
        scale(.62);

    opacity:0;

    background:transparent;

    z-index:8;

    transition:
        opacity .45s ease,
        transform .65s
        cubic-bezier(.2,.9,.3,1.15);
}


.round-image{

    position:relative;

    z-index:3;

    width:100%;
    height:100%;

    display:block;

    object-fit:contain;

    background:transparent;

    pointer-events:none;

    filter:
        drop-shadow(
            0 10px 16px
            rgba(0,0,0,.28)
        );
}


/* =====================================================
   МЯГКОЕ СВЕЧЕНИЕ КАРТИНКИ
===================================================== */

.picture-glow{

    position:absolute;

    left:50%;
    top:50%;

    width:60%;
    height:60%;

    transform:
        translate(-50%,-50%)
        scale(.99);

    border-radius:50%;

    opacity:0;

    pointer-events:none;

    z-index:6;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.18) 0%,
            rgba(202,150,255,.13) 30%,
            rgba(103,112,255,.08) 50%,
            rgba(100,60,180,.03) 66%,
            transparent 79%
        );

    filter:
        blur(16px);
}


.picture-glow.active{

    animation:
        glowPulse
        8s
        ease-in-out
        infinite;
}


@keyframes glowPulse{

    0%{

        transform:
            translate(-50%,-50%)
            scale(.99);

        opacity:.58;
    }


    50%{

        transform:
            translate(-50%,-50%)
            scale(1.012);

        opacity:.73;
    }


    100%{

        transform:
            translate(-50%,-50%)
            scale(.99);

        opacity:.58;
    }

}


/* =====================================================
   МАГИЧЕСКИЙ ЦЕНТР
===================================================== */

.magic-center{

    position:absolute;

    left:50%;
    top:50%;

    width:12%;

    aspect-ratio:1;

    transform:
        translate(-50%,-50%)
        scale(.2);

    border-radius:50%;

    opacity:0;

    z-index:3;

    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.85) 0%,
            rgba(181,116,255,.38) 30%,
            rgba(78,48,170,.08) 62%,
            transparent 75%
        );

    filter:
        blur(4px);
}


/* =====================================================
   БЛЁСТКИ
===================================================== */

.sparkles{

    position:absolute;

    left:50%;
    top:50%;

    width:64%;
    height:64%;

    transform:
        translate(-50%,-50%);

    pointer-events:none;

    z-index:18;
}


.spark{

    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 5px white,
        0 0 11px
        rgba(200,135,255,.95),
        0 0 18px
        rgba(100,160,255,.65);

    opacity:0;

    animation:
        sparklePop
        .95s
        ease-out
        forwards;
}


.spark.star{

    border-radius:0;

    clip-path:
        polygon(
            50% 0%,
            61% 39%,
            100% 50%,
            61% 61%,
            50% 100%,
            39% 61%,
            0% 50%,
            39% 39%
        );
}


@keyframes sparklePop{

    0%{

        opacity:0;

        transform:
            scale(.1)
            rotate(0deg);
    }


    25%{

        opacity:1;

        transform:
            scale(1.2)
            rotate(25deg);
    }


    65%{

        opacity:.8;

        transform:
            scale(.8)
            rotate(50deg);
    }


    100%{

        opacity:0;

        transform:
            scale(.1)
            translateY(-10px)
            rotate(75deg);
    }

}


/* =====================================================
   КАЛЕЙДОСКОП
===================================================== */

.kaleidoscope{

    position:absolute;

    inset:0;

    z-index:5;

    transform-origin:
        50% 50%;

    will-change:
        transform;
}


/* =====================================================
   КАМНИ
===================================================== */

.gem-wrap{

    position:absolute;

    width:14.5%;
    height:14.5%;

    pointer-events:none;

    transform:
        translate(-50%,-50%);

    transform-origin:
        50% 50%;
}


.gem{

    position:absolute;

    left:50%;
    top:50%;

    width:100%;
    height:100%;

    object-fit:contain;

    transform-origin:
        50% 50%;

    pointer-events:none;
}


.gem-shine{

    position:absolute;

    left:50%;
    top:50%;

    width:30%;
    height:135%;

    transform:
        translate(-50%,-50%)
        rotate(25deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.72),
            transparent
        );

    opacity:0;

    filter:
        blur(4px);

    pointer-events:none;
}


/* =====================================================
   БЛИК СТЕКЛА
===================================================== */

.glass-shine{

    position:absolute;

    inset:0;

    z-index:20;

    border-radius:50%;

    pointer-events:none;

    background:

        radial-gradient(
            circle at 31% 20%,
            rgba(255,255,255,.13),
            transparent 24%
        ),

        radial-gradient(
            circle at center,
            transparent 69%,
            rgba(32,14,65,.18)
        );
}


/* =====================================================
   КОЛЕСО
===================================================== */

.wheel-wrap{

    position:absolute;

    z-index:30;

    display:flex;

    align-items:center;
    justify-content:center;
}


.wheel{

    width:100%;
    height:100%;

    object-fit:contain;

    cursor:grab;

    touch-action:none;

    transform-origin:
        50% 50%;

    filter:
        drop-shadow(
            0 10px 13px
            rgba(0,0,0,.5)
        );

    will-change:
        transform;
}


.wheel.dragging{

    cursor:grabbing;
}


/* =====================================================
   НАДПИСЬ "ПОКРУТИ КОЛЕСО"
===================================================== */

.wheel-hint{

    position:absolute;

    z-index:45;

    pointer-events:none;

    overflow:visible;

    opacity:1;

    transition:
        opacity .5s ease;
}


.wheel-hint.hidden{

    opacity:0;
}


.wheel-hint text{

    fill:#fff8e5;

    font-family:
        "Cormorant SC",
        serif;

    font-weight:700;

    font-size:28px;

    letter-spacing:
        1.1px;

    paint-order:
        stroke fill;

    stroke:
        rgba(40,16,74,.75);

    stroke-width:
        3px;

    filter:
        drop-shadow(
            0 2px 4px
            rgba(0,0,0,.75)
        )
        drop-shadow(
            0 0 5px
            rgba(184,116,255,.45)
        );
}


/* =====================================================
   КНОПКА ДАЛЬШЕ
===================================================== */

.next{

    position:absolute;

    left:84%;
    top:32%;

    width:
        clamp(
            195px,
            19vw,
            305px
        );

    height:
        clamp(
            80px,
            8vw,
            122px
        );

    transform:
        translate(-50%,-50%)
        scale(.82);

    z-index:60;

    border:0;

    padding:
        0 30px;

    background:
        url("ramka.png")
        center /
        contain
        no-repeat;

    color:
        #fff6da;

    font-family:
        "Cormorant SC",
        serif;

    font-size:
        clamp(
            22px,
            2vw,
            32px
        );

    font-weight:
        700;

    letter-spacing:
        1px;

    text-shadow:

        0 2px 3px
        rgba(0,0,0,.9),

        0 0 7px
        rgba(214,167,255,.65);

    cursor:pointer;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .5s ease,
        transform .5s
        cubic-bezier(.2,.8,.3,1.15);

    box-shadow:none;
}


.next.visible{

    opacity:1;

    pointer-events:auto;

    transform:
        translate(-50%,-50%)
        scale(1);
}


.next:hover{

    transform:
        translate(-50%,-50%)
        scale(1.04);
}


/* =====================================================
   УБИРАЕМ СТАНДАРТНОЕ ОФОРМЛЕНИЕ КНОПКИ
===================================================== */

button{

    font-family:
        "Cormorant SC",
        serif;

    -webkit-appearance:none;

    appearance:none;
}

</style>

</head>


<body>


<div
    class="game"
    id="game"
>


    <!-- ФОН -->

    <img
        src="fon.png"
        class="background"
        id="background"
        alt=""
    >


    <!-- БОЛЬШОЙ КАЛЕЙДОСКОП -->

    <div
        class="portal"
        id="portal"
    >


        <div
            class="picture-glow"
            id="pictureGlow"
        ></div>


        <div
            class="hidden-picture"
            id="hiddenPicture"
        >

            <img
                src=""
                class="round-image"
                id="roundImage"
                alt=""
                draggable="false"
            >

        </div>


        <div
            class="magic-center"
            id="magicCenter"
        ></div>


        <div
            class="sparkles"
            id="sparkles"
        ></div>


        <div
            class="kaleidoscope"
            id="kaleidoscope"
        ></div>


        <div
            class="glass-shine"
        ></div>


    </div>


    <!-- =================================================
         ТЕКСТ ДУГОЙ СПРАВА ОТ КОЛЕСА
    ================================================== -->

    <svg
        class="wheel-hint"
        id="wheelHint"
        viewBox="0 0 260 330"
    >

        <defs>

            <path
                id="hintCurve"
                d="
                    M 70 38
                    C 205 65,
                      220 185,
                      145 292
                "
            />

        </defs>


        <text>

            <textPath
                href="#hintCurve"
                startOffset="5%"
            >
                Покрути колесо
            </textPath>

        </text>

    </svg>


    <!-- =================================================
         КОЛЕСО
    ================================================== -->

    <div
        class="wheel-wrap"
        id="wheelWrap"
    >

        <img
            src="wheel.png"
            class="wheel"
            id="wheel"
            draggable="false"
            alt=""
        >

    </div>


    <!-- =================================================
         КНОПКА ДАЛЬШЕ
    ================================================== -->

    <button
        class="next"
        id="next"
    >
        Дальше
    </button>


    <!-- =================================================
         МУЗЫКА
    ================================================== -->

    <audio
        id="wheelMusic"
        src="diamonds_2.mp3"
        preload="auto"
        loop
    ></audio>


</div>



<script>

/* =====================================================
   10 РАУНДОВ
===================================================== */

const rounds = [

    {
        image:
            "raund-1/image.png"
    },

    {
        image:
            "raund-1/dhdj.png"
    },

    {
        image:
            "raund-1/dhfj.png"
    },

    {
        image:
            "raund-1/1AFAA32C-3BEC-4EC1-9EC9-E696460B9050.PNG"
    },

    {
        image:
            "raund-1/42256A45-49C6-4D18-BF23-A170B5FC0324.PNG"
    },

    {
        image:
            "raund-1/5D75953B-A4D9-495D-AB7C-13C861EAC3CE.PNG"
    },

    {
        image:
            "raund-1/859A2E0A-7559-478D-9352-87BE981D42E5.PNG"
    },

    {
        image:
            "raund-1/B2DB3E80-35DF-4068-B97F-CE47EECE187C.PNG"
    },

    {
        image:
            "raund-1/B334EF3B-2C3D-4BF0-B4B1-B43D114B293E.PNG"
    },

    {
        image:
            "raund-1/D813B8BE-9A92-4737-A1FF-D4938E490209.PNG"
    }

];


let roundIndex =
    0;


/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const game =
    document.getElementById(
        "game"
    );


const background =
    document.getElementById(
        "background"
    );


const portal =
    document.getElementById(
        "portal"
    );


const kaleidoscope =
    document.getElementById(
        "kaleidoscope"
    );


const wheelWrap =
    document.getElementById(
        "wheelWrap"
    );


const wheel =
    document.getElementById(
        "wheel"
    );


const wheelHint =
    document.getElementById(
        "wheelHint"
    );


const wheelMusic =
    document.getElementById(
        "wheelMusic"
    );


const hiddenPicture =
    document.getElementById(
        "hiddenPicture"
    );


const roundImage =
    document.getElementById(
        "roundImage"
    );


const magicCenter =
    document.getElementById(
        "magicCenter"
    );


const pictureGlow =
    document.getElementById(
        "pictureGlow"
    );


const sparkles =
    document.getElementById(
        "sparkles"
    );


const next =
    document.getElementById(
        "next"
    );


/* =====================================================
   РАЗМЕРЫ И ПОЗИЦИИ
===================================================== */

const DESIGN_WIDTH =
    1536;


const DESIGN_HEIGHT =
    1024;


const PORTAL_X =
    325;


const PORTAL_Y =
    133;


const PORTAL_SIZE =
    660;


const WHEEL_X =
    1065;


const WHEEL_Y =
    490;


const WHEEL_SIZE =
    280;


/* =====================================================
   ПОЗИЦИОНИРОВАНИЕ
===================================================== */

function positionElements(){

    const screenW =
        game.clientWidth;


    const screenH =
        game.clientHeight;


    const scale =
        Math.max(

            screenW /
            DESIGN_WIDTH,

            screenH /
            DESIGN_HEIGHT

        );


    const renderedW =
        DESIGN_WIDTH *
        scale;


    const renderedH =
        DESIGN_HEIGHT *
        scale;


    const cropX =
        (
            screenW -
            renderedW
        ) / 2;


    const cropY =
        (
            screenH -
            renderedH
        ) / 2;


    /* БОЛЬШОЙ КРУГ */

    portal.style.left =

        PORTAL_X *
        scale +

        cropX +

        "px";


    portal.style.top =

        PORTAL_Y *
        scale +

        cropY +

        "px";


    portal.style.width =

        PORTAL_SIZE *
        scale +

        "px";


    portal.style.height =

        PORTAL_SIZE *
        scale +

        "px";


    /* КОЛЕСО */

    wheelWrap.style.left =

        WHEEL_X *
        scale +

        cropX +

        "px";


    wheelWrap.style.top =

        WHEEL_Y *
        scale +

        cropY +

        "px";


    wheelWrap.style.width =

        WHEEL_SIZE *
        scale +

        "px";


    wheelWrap.style.height =

        WHEEL_SIZE *
        scale +

        "px";


    /* ТЕКСТ СПРАВА ОТ КОЛЕСА */

    wheelHint.style.left =

        (
            WHEEL_X +
            75
        )

        *

        scale

        +

        cropX

        +

        "px";


    wheelHint.style.top =

        (
            WHEEL_Y -
            92
        )

        *

        scale

        +

        cropY

        +

        "px";


    wheelHint.style.width =

        260 *
        scale +

        "px";


    wheelHint.style.height =

        330 *
        scale +

        "px";

}


/* =====================================================
   КАМНИ
===================================================== */

const gemImages = [

    "gem1.png",
    "gem2.png",
    "gem3.png",
    "gem4.png"

];


let gems =
    [];


/* =====================================================
   СОЗДАЁМ КАМНИ
===================================================== */

function createGems(){

    kaleidoscope.innerHTML =
        "";


    gems =
        [];


    const rings = [

        {
            count:8,
            radius:7,
            size:1.30
        },

        {
            count:12,
            radius:16,
            size:1.18
        },

        {
            count:16,
            radius:25,
            size:1.05
        },

        {
            count:18,
            radius:32,
            size:.94
        },

        {
            count:22,
            radius:36.5,
            size:.76
        },

        {
            count:26,
            radius:40,
            size:.56
        }

    ];


    let globalIndex =
        0;


    rings.forEach(

        (
            ring,
            ringIndex
        ) => {


            for(
                let i = 0;
                i < ring.count;
                i++
            ){


                const wrap =
                    document.createElement(
                        "div"
                    );


                wrap.className =
                    "gem-wrap";


                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    gemImages[
                        globalIndex %
                        4
                    ];


                img.className =
                    "gem";


                img.draggable =
                    false;


                const shine =
                    document.createElement(
                        "div"
                    );


                shine.className =
                    "gem-shine";


                wrap.appendChild(
                    img
                );


                wrap.appendChild(
                    shine
                );


                kaleidoscope.appendChild(
                    wrap
                );


                const angle =

                    (
                        360 /
                        ring.count
                    )

                    *

                    i

                    +

                    ringIndex *
                    8.2;


                const radiusVariation =

                    (
                        (
                            i %
                            3
                        )
                        -
                        1
                    )

                    *

                    .85;


                const scaleVariation =

                    .93

                    +

                    (
                        i %
                        4
                    )

                    *

                    .03;


                wrap.dataset.angle =
                    angle;


                wrap.dataset.radius =

                    ring.radius

                    +

                    radiusVariation;


                wrap.dataset.scale =

                    ring.size

                    *

                    scaleVariation;


                wrap.dataset.ring =
                    ringIndex;


                wrap.dataset.phase =

                    globalIndex

                    *

                    .67;


                gems.push({

                    wrap,
                    img,
                    shine

                });


                globalIndex++;

            }

        }

    );


    updateGems(
        0,
        0
    );

}


/* =====================================================
   БЛЁСТКИ
===================================================== */

function createSparkles(){

    sparkles.innerHTML =
        "";


    const count =
        16;


    for(
        let i = 0;
        i < count;
        i++
    ){

        const spark =
            document.createElement(
                "div"
            );


        spark.className =

            Math.random() >
            .45

            ?

            "spark star"

            :

            "spark";


        const angle =

            Math.random()

            *

            Math.PI

            *

            2;


        const radius =

            15

            +

            Math.random()

            *

            34;


        const x =

            50

            +

            Math.cos(
                angle
            )

            *

            radius;


        const y =

            50

            +

            Math.sin(
                angle
            )

            *

            radius;


        const size =

            4

            +

            Math.random()

            *

            6;


        spark.style.left =
            x +
            "%";


        spark.style.top =
            y +
            "%";


        spark.style.width =
            size +
            "px";


        spark.style.height =
            size +
            "px";


        spark.style.animationDelay =

            Math.random()

            *

            .2

            +

            "s";


        sparkles.appendChild(
            spark
        );

    }

}


/* =====================================================
   ПОСТОЯННЫЕ БЛЁСТКИ
===================================================== */

let sparkleInterval =
    null;


function startMagicEffect(){

    pictureGlow.classList.add(
        "active"
    );


    createSparkles();


    clearInterval(
        sparkleInterval
    );


    sparkleInterval =
        setInterval(

            createSparkles,

            1150

        );

}


function stopMagicEffect(){

    pictureGlow.classList.remove(
        "active"
    );


    clearInterval(
        sparkleInterval
    );


    sparkleInterval =
        null;


    sparkles.innerHTML =
        "";

}


/* =====================================================
   МУЗЫКА
===================================================== */

let fadeTimer =
    null;


function startWheelMusic(){

    clearInterval(
        fadeTimer
    );


    fadeTimer =
        null;


    wheelMusic.volume =
        .42;


    wheelMusic
        .play()
        .catch(
            () => {}
        );

}


/* =====================================================
   ПЛАВНО ОСТАНАВЛИВАЕМ МУЗЫКУ
===================================================== */

function stopWheelMusic(){

    clearInterval(
        fadeTimer
    );


    const startVolume =
        wheelMusic.volume;


    let currentStep =
        0;


    const steps =
        10;


    const duration =
        250;


    fadeTimer =
        setInterval(

            () => {


                currentStep++;


                const progress =

                    currentStep

                    /

                    steps;


                wheelMusic.volume =

                    Math.max(

                        0,

                        startVolume

                        *

                        (
                            1 -
                            progress
                        )

                    );


                if(
                    currentStep >=
                    steps
                ){


                    clearInterval(
                        fadeTimer
                    );


                    fadeTimer =
                        null;


                    wheelMusic.pause();


                    wheelMusic.volume =
                        .42;

                }

            },

            duration /
            steps

        );

}


/* =====================================================
   НОВЫЙ РАУНД — МУЗЫКА С НАЧАЛА
===================================================== */

function resetWheelMusic(){

    clearInterval(
        fadeTimer
    );


    fadeTimer =
        null;


    wheelMusic.pause();


    try{

        wheelMusic.currentTime =
            0;

    }
    catch(error){}


    wheelMusic.volume =
        .42;

}


/* =====================================================
   АНИМАЦИЯ КАМНЕЙ
===================================================== */

function updateGems(
    progress,
    wheelRotation
){

    const opening =

        Math.max(

            0,

            Math.min(

                1,

                (
                    progress -
                    .48
                )

                /

                .52

            )

        );


    const openingRadius =

        opening

        *

        28;


    gems.forEach(

        (
            gem,
            index
        ) => {


            const wrap =
                gem.wrap;


            const img =
                gem.img;


            const shine =
                gem.shine;


            const angle =

                Number(
                    wrap.dataset.angle
                );


            const radius =

                Number(
                    wrap.dataset.radius
                );


            const baseScale =

                Number(
                    wrap.dataset.scale
                );


            const ring =

                Number(
                    wrap.dataset.ring
                );


            const phase =

                Number(
                    wrap.dataset.phase
                );


            let movementPower =
                1.05;


            if(
                ring ===
                4
            ){

                movementPower =
                    .65;

            }


            if(
                ring ===
                5
            ){

                movementPower =
                    .4;

            }


            const movement =

                Math.sin(

                    wheelRotation *
                    .022

                    +

                    phase

                )

                *

                movementPower;


            let currentRadius =

                radius

                +

                movement;


            if(
                opening >
                0
            ){


                const pushStrength =

                    Math.max(

                        0,

                        openingRadius

                        -

                        currentRadius

                    );


                currentRadius +=

                    pushStrength

                    *

                    .72;


                if(
                    ring <=
                    2
                ){

                    currentRadius +=

                        opening

                        *

                        (
                            3.8

                            -

                            ring *
                            .8
                        );

                }

            }


            currentRadius =

                Math.min(

                    currentRadius,

                    39

                );


            let angularPower =
                4;


            if(
                ring ===
                4
            ){

                angularPower =
                    2.8;

            }


            if(
                ring ===
                5
            ){

                angularPower =
                    2;

            }


            const ringShift =

                opening

                *

                (
                    ring %
                    2 ===
                    0

                    ?

                    7

                    :

                    -7
                );


            const angularMovement =

                Math.sin(

                    wheelRotation *
                    .018

                    +

                    phase

                )

                *

                angularPower;


            const currentAngle =

                angle

                +

                angularMovement

                +

                ringShift;


            const rad =

                currentAngle

                *

                Math.PI

                /

                180;


            const x =

                50

                +

                Math.cos(
                    rad
                )

                *

                currentRadius;


            const y =

                50

                +

                Math.sin(
                    rad
                )

                *

                currentRadius;


            wrap.style.left =
                x +
                "%";


            wrap.style.top =
                y +
                "%";


            const personalDirection =

                index %
                2 ===
                0

                ?

                1

                :

                -1;


            const gemRotation =

                currentAngle

                +

                90

                +

                wheelRotation *
                .13 *
                personalDirection

                +

                Math.sin(

                    phase

                    +

                    wheelRotation *
                    .024

                )

                *

                8;


            const pulse =

                1

                +

                Math.sin(

                    phase

                    +

                    wheelRotation *
                    .03

                )

                *

                .045;


            const centerShrink =

                ring <=
                2

                ?

                1

                -

                opening *
                .13

                :

                1;


            img.style.transform = `

                translate(
                    -50%,
                    -50%
                )

                rotate(
                    ${gemRotation}deg
                )

                scale(
                    ${
                        baseScale *
                        pulse *
                        centerShrink
                    }
                )

            `;


            const shimmer =

                Math.sin(

                    phase

                    +

                    wheelRotation *
                    .038

                );


            const brightness =

                1.08

                +

                shimmer *
                .17;


            const glow =

                5

                +

                Math.abs(
                    shimmer
                )

                *

                10;


            img.style.filter = `

                brightness(
                    ${brightness}
                )

                saturate(
                    1.17
                )

                drop-shadow(
                    0 0
                    ${glow}px
                    rgba(
                        164,
                        115,
                        255,
                        .42
                    )
                )

            `;


            shine.style.opacity =

                Math.max(
                    0,
                    shimmer
                )

                *

                .55;


            let opacity =
                1;


            if(
                progress >
                .88
            ){

                opacity =

                    1

                    -

                    (
                        progress

                        -

                        .88
                    )

                    /

                    .12;

            }


            wrap.style.opacity =

                Math.max(
                    0,
                    opacity
                );

        }

    );


    /* =================================================
       СВЕЧЕНИЕ ЦЕНТРА
    ================================================= */

    magicCenter.style.opacity =

        opening

        *

        .55;


    magicCenter.style.width =

        (
            12

            +

            opening *
            48
        )

        +

        "%";


    /* =================================================
       ПОЯВЛЕНИЕ КАРТИНКИ
    ================================================= */

    if(
        progress >
        .72
    ){


        const pictureProgress =

            Math.min(

                1,

                (
                    progress -
                    .72
                )

                /

                .28

            );


        hiddenPicture.style.opacity =
            pictureProgress;


        hiddenPicture.style.transform = `

            translate(
                -50%,
                -50%
            )

            scale(
                ${
                    .72

                    +

                    pictureProgress *
                    .28
                }
            )

        `;

    }

    else{

        hiddenPicture.style.opacity =
            0;

    }

}


/* =====================================================
   СОСТОЯНИЕ
===================================================== */

let dragging =
    false;


let previousAngle =
    0;


let wheelRotation =
    0;


let totalRotation =
    0;


let finished =
    false;


const REQUIRED_ROTATION =
    450;


/* =====================================================
   УГОЛ УКАЗАТЕЛЯ
===================================================== */

function pointerAngle(
    event
){

    const rect =
        wheel.getBoundingClientRect();


    const centerX =

        rect.left

        +

        rect.width /
        2;


    const centerY =

        rect.top

        +

        rect.height /
        2;


    return Math.atan2(

        event.clientY -
        centerY,

        event.clientX -
        centerX

    )

    *

    180

    /

    Math.PI;

}


/* =====================================================
   НАЧАЛО ВРАЩЕНИЯ
===================================================== */

wheel.addEventListener(

    "pointerdown",

    event => {


        if(
            finished
        ){

            return;

        }


        dragging =
            true;


        wheel.classList.add(
            "dragging"
        );


        previousAngle =
            pointerAngle(
                event
            );


        wheel.setPointerCapture(
            event.pointerId
        );


        startWheelMusic();

    }

);


/* =====================================================
   ВРАЩЕНИЕ
===================================================== */

wheel.addEventListener(

    "pointermove",

    event => {


        if(
            !dragging

            ||

            finished
        ){

            return;

        }


        const currentAngle =

            pointerAngle(
                event
            );


        let delta =

            currentAngle

            -

            previousAngle;


        if(
            delta >
            180
        ){

            delta -=
                360;

        }


        if(
            delta <
            -180
        ){

            delta +=
                360;

        }


        previousAngle =
            currentAngle;


        wheelRotation +=
            delta;


        totalRotation +=

            Math.abs(
                delta
            );


        /* КРУТИМ КОЛЕСО */

        wheel.style.transform = `

            rotate(
                ${wheelRotation}deg
            )

        `;


        /* КРУТИМ УЗОР */

        kaleidoscope.style.transform = `

            rotate(
                ${
                    wheelRotation *
                    .18
                }deg
            )

        `;


        const progress =

            Math.min(

                totalRotation

                /

                REQUIRED_ROTATION,

                1

            );


        updateGems(
            progress,
            wheelRotation
        );


        if(
            progress >=
            1
        ){

            revealPicture();

        }

    }

);


/* =====================================================
   КОНЕЦ ВРАЩЕНИЯ
===================================================== */

function stopDragging(){

    if(
        !dragging
    ){

        return;

    }


    dragging =
        false;


    wheel.classList.remove(
        "dragging"
    );


    stopWheelMusic();

}


wheel.addEventListener(
    "pointerup",
    stopDragging
);


wheel.addEventListener(
    "pointercancel",
    stopDragging
);


/* =====================================================
   ПОЯВЛЕНИЕ КАРТИНКИ
===================================================== */

function revealPicture(){

    if(
        finished
    ){

        return;

    }


    finished =
        true;


    dragging =
        false;


    wheel.classList.remove(
        "dragging"
    );


    stopWheelMusic();


    /* УБИРАЕМ ТЕКСТ */

    wheelHint.classList.add(
        "hidden"
    );


    /* ПОКАЗЫВАЕМ КАРТИНКУ */

    hiddenPicture.style.opacity =
        1;


    hiddenPicture.style.transform = `

        translate(
            -50%,
            -50%
        )

        scale(1)

    `;


    startMagicEffect();


    /* ПОКАЗЫВАЕМ ДАЛЬШЕ */

    setTimeout(

        () => {

            next.classList.add(
                "visible"
            );

        },

        450

    );

}


/* =====================================================
   НОВЫЙ РАУНД
===================================================== */

function loadRound(){

    stopMagicEffect();


    const round =
        rounds[
            roundIndex
        ];


    roundImage.src =
        round.image;


    hiddenPicture.style.opacity =
        0;


    hiddenPicture.style.transform = `

        translate(
            -50%,
            -50%
        )

        scale(.62)

    `;


    next.classList.remove(
        "visible"
    );


    /* ВОЗВРАЩАЕМ ТЕКСТ */

    wheelHint.classList.remove(
        "hidden"
    );


    magicCenter.style.opacity =
        0;


    dragging =
        false;


    finished =
        false;


    totalRotation =
        0;


    wheelRotation =
        0;


    wheel.style.transform =
        "rotate(0deg)";


    kaleidoscope.style.transform =
        "rotate(0deg)";


    createGems();

}


/* =====================================================
   ДАЛЬШЕ
===================================================== */

next.addEventListener(

    "click",

    () => {


        stopMagicEffect();


        /* НОВЫЙ РАУНД —
           МУЗЫКА С НАЧАЛА */

        resetWheelMusic();


        roundIndex++;


        if(
            roundIndex >=
            rounds.length
        ){

            roundIndex =
                0;

        }


        loadRound();

    }

);


/* =====================================================
   СТАРТ
===================================================== */

background.addEventListener(

    "load",

    () => {

        positionElements();

        resetWheelMusic();

        loadRound();

    }

);


window.addEventListener(

    "resize",

    positionElements

);


if(
    background.complete
){

    positionElements();

    resetWheelMusic();

    loadRound();

}

</script>
