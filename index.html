<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Калейдоскоп — звук Ль</title>


<style>

/* =====================================================
   ОСНОВА
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    -webkit-tap-highlight-color:
        transparent;
}


html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    user-select:none;
    -webkit-user-select:none;

    touch-action:none;

    background:#070512;

    font-family:
        Arial,
        sans-serif;
}


/* =====================================================
   ИГРОВАЯ СЦЕНА
===================================================== */

.game{

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background-image:
        url("fon.png");

    background-size:
        cover;

    background-position:
        center;

    background-repeat:
        no-repeat;
}


/* =====================================================
   ОБЛАСТЬ ВНУТРИ ПОРТАЛА

   Координаты рассчитаны под наш фон.
   Если после открытия увидим,
   что круг на пару пикселей не совпадает,
   легко подвинем.
===================================================== */

.portal{

    position:absolute;

    left:18.7%;
    top:12%;

    width:51.5%;
    aspect-ratio:1 / 1;

    border-radius:50%;

    overflow:hidden;

    z-index:5;

    background:
        radial-gradient(
            circle at center,
            #17102f 0%,
            #090615 72%,
            #030208 100%
        );

    box-shadow:
        inset 0 0 45px rgba(0,0,0,.9);
}


/* =====================================================
   СПРЯТАННАЯ КАРТИНКА
===================================================== */

.hidden-picture{

    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:2;

    opacity:0;

    transform:
        scale(.55);

    transition:
        opacity .7s ease,
        transform .8s cubic-bezier(.2,.9,.3,1.25);
}


.hidden-picture.visible{

    opacity:1;

    transform:
        scale(1);
}


.picture{

    font-size:
        clamp(
            110px,
            17vw,
            245px
        );

    filter:
        drop-shadow(
            0 10px 14px
            rgba(0,0,0,.45)
        );
}


/* =====================================================
   КАЛЕЙДОСКОП
===================================================== */

.kaleidoscope{

    position:absolute;
    inset:-12%;

    z-index:5;

    transform-origin:center center;

    will-change:transform;
}


/* =====================================================
   СЕКТОРА

   Это уже не простые случайные куски.
   Делаем более симметричный узор.
===================================================== */

.piece{

    position:absolute;

    left:50%;
    top:50%;

    width:28%;
    height:42%;

    transform-origin:
        0 0;

    clip-path:
        polygon(
            0 0,
            100% 18%,
            72% 100%,
            6% 72%
        );

    border-radius:
        18% 42% 24% 38%;

    mix-blend-mode:
        screen;

    box-shadow:
        inset 0 0 18px
        rgba(255,255,255,.38);

    will-change:
        transform,
        opacity;
}


/* внутренний блик */

.piece::after{

    content:"";

    position:absolute;
    inset:8%;

    border:

        2px solid

        rgba(255,255,255,.15);

    clip-path:
        inherit;
}


/* =====================================================
   БЛИК НА ЛИНЗЕ
===================================================== */

.portal-glass{

    position:absolute;
    inset:0;

    z-index:15;

    pointer-events:none;

    border-radius:50%;

    background:

        radial-gradient(
            circle at 34% 23%,
            rgba(255,255,255,.17),
            transparent 24%
        ),

        radial-gradient(
            circle at center,
            transparent 62%,
            rgba(8,3,24,.58) 100%
        );

    box-shadow:

        inset 0 0 35px
        rgba(110,80,255,.12);
}


/* =====================================================
   КОЛЕСО
===================================================== */

.wheel-wrap{

    position:absolute;

    right:5.2%;
    bottom:8%;

    width:
        clamp(
            150px,
            22vw,
            330px
        );

    aspect-ratio:1 / 1;

    z-index:40;

    display:flex;
    align-items:center;
    justify-content:center;
}


.wheel{

    width:100%;
    height:100%;

    object-fit:contain;

    cursor:grab;

    touch-action:none;

    transform-origin:
        50% 50%;

    filter:

        drop-shadow(
            0 12px 14px
            rgba(0,0,0,.55)
        );

    will-change:
        transform;
}


.wheel.dragging{

    cursor:grabbing;
}


/* =====================================================
   ПОДСКАЗКА
===================================================== */

.hint{

    position:absolute;

    left:50%;
    top:3.5%;

    transform:
        translateX(-50%);

    z-index:50;

    color:white;

    font-size:
        clamp(
            20px,
            2.4vw,
            36px
        );

    font-weight:700;

    text-align:center;

    text-shadow:
        0 3px 10px
        rgba(0,0,0,.9);

    transition:
        opacity .35s ease;

    pointer-events:none;
}


/* =====================================================
   КНОПКА ДАЛЬШЕ
===================================================== */

.next{

    position:absolute;

    left:50%;
    bottom:4%;

    transform:
        translateX(-50%)
        scale(.8);

    z-index:60;

    border:none;

    border-radius:
        24px;

    padding:
        15px 35px;

    font-size:
        clamp(
            19px,
            2vw,
            27px
        );

    font-weight:800;

    color:#3b245d;

    background:

        linear-gradient(
            180deg,
            #fff7cb,
            #ffd56b
        );

    box-shadow:

        0 7px 0
        #ad6b20,

        0 13px 25px
        rgba(0,0,0,.4);

    cursor:pointer;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .35s ease,
        transform .35s ease;
}


.next.visible{

    opacity:1;

    pointer-events:auto;

    transform:
        translateX(-50%)
        scale(1);
}


.next:active{

    transform:
        translateX(-50%)
        translateY(4px)
        scale(.97);

    box-shadow:

        0 3px 0
        #ad6b20;
}


/* =====================================================
   МОБИЛЬНЫЙ ЭКРАН
===================================================== */

@media(max-width:700px){

    .portal{

        left:7%;
        top:16%;

        width:71%;
    }


    .wheel-wrap{

        right:1%;

        bottom:5%;

        width:38vw;
    }


    .hint{

        width:90%;
    }

}

</style>

</head>


<body>


<div class="game">


    <!-- ===============================================
         ПОДСКАЗКА
    ================================================ -->

    <div
        class="hint"
        id="hint"
    >
        Покрути волшебное колесо ✨
    </div>



    <!-- ===============================================
         ВНУТРЕННОСТЬ КАЛЕЙДОСКОПА
    ================================================ -->

    <div
        class="portal"
        id="portal"
    >


        <!-- спрятанная картинка -->

        <div
            class="hidden-picture"
            id="hiddenPicture"
        >

            <div
                class="picture"
                id="picture"
            >
                🦁
            </div>

        </div>



        <!-- движущиеся стеклышки -->

        <div
            class="kaleidoscope"
            id="kaleidoscope"
        ></div>



        <!-- стеклянный блик -->

        <div
            class="portal-glass"
        ></div>


    </div>



    <!-- ===============================================
         КОЛЕСО
    ================================================ -->

    <div
        class="wheel-wrap"
    >

        <img
            src="wheel.png"
            class="wheel"
            id="wheel"
            alt=""
            draggable="false"
        >

    </div>



    <!-- ===============================================
         ДАЛЬШЕ
    ================================================ -->

    <button
        class="next"
        id="next"
    >
        Дальше →
    </button>


</div>



<script>

/* =====================================================
   РАУНДЫ

   Пока стоят эмодзи.
   Когда подготовим картинки,
   просто заменим emoji на image.
===================================================== */

const rounds = [

    {
        emoji:"🦁"
    },

    {
        emoji:"🦊"
    },

    {
        emoji:"🍋"
    },

    {
        emoji:"🦢"
    },

    {
        emoji:"🍃"
    }

];


let roundIndex = 0;


/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const wheel =
    document.getElementById(
        "wheel"
    );


const kaleidoscope =
    document.getElementById(
        "kaleidoscope"
    );


const hiddenPicture =
    document.getElementById(
        "hiddenPicture"
    );


const picture =
    document.getElementById(
        "picture"
    );


const hint =
    document.getElementById(
        "hint"
    );


const next =
    document.getElementById(
        "next"
    );



/* =====================================================
   ЦВЕТА СТЁКЛЫШЕК
===================================================== */

const colors = [

    ["#ff45b5","#a943ff"],

    ["#42dfff","#3768ff"],

    ["#52ffd1","#00b99a"],

    ["#ffd04a","#ff6a3d"],

    ["#944fff","#ef5cff"],

    ["#36b6ff","#7a5cff"]

];



/* =====================================================
   СОЗДАНИЕ УЗОРА
===================================================== */

const pieceCount = 30;

let pieces = [];


function createKaleidoscope(){

    kaleidoscope.innerHTML = "";

    pieces = [];


    for(
        let i = 0;
        i < pieceCount;
        i++
    ){

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "piece";


        const angle =
            (
                360 /
                pieceCount
            ) * i;


        const radius =
            12 +
            (
                i % 5
            ) * 17;


        const pair =
            colors[
                i %
                colors.length
            ];


        piece.style.background = `

            linear-gradient(
                ${
                    angle + 45
                }deg,

                ${pair[0]},

                ${pair[1]}
            )

        `;


        piece.dataset.angle =
            angle;


        piece.dataset.radius =
            radius;


        piece.dataset.scale =
            (
                .72 +
                (
                    i % 4
                ) * .09
            );


        kaleidoscope.appendChild(
            piece
        );


        pieces.push(
            piece
        );

    }


    updatePieces(0);

}



/* =====================================================
   АНИМАЦИЯ КАМУШКОВ

   progress:
   0 = закрыто
   1 = полностью открыто
===================================================== */

function updatePieces(progress){

    pieces.forEach(
        (
            piece,
            i
        ) => {

            const angle =
                Number(
                    piece.dataset.angle
                );


            const radius =
                Number(
                    piece.dataset.radius
                );


            const scale =
                Number(
                    piece.dataset.scale
                );


            /*
            При вращении кусочки
            постепенно уходят
            от центра.
            */

            const spread =
                radius +
                progress *
                (
                    190 +
                    (
                        i % 6
                    ) * 13
                );


            /*
            Часть элементов
            вращаем в другую сторону,
            чтобы узор был живее.
            */

            const direction =
                i % 2 === 0
                ? 1
                : -1;


            const localSpin =
                progress *
                260 *
                direction;


            piece.style.transform = `

                rotate(
                    ${
                        angle +
                        localSpin
                    }deg
                )

                translate(
                    ${spread}px
                )

                rotate(
                    ${
                        -angle +
                        localSpin * .35
                    }deg
                )

                scale(
                    ${
                        scale *
                        (
                            1 -
                            progress * .18
                        )
                    }
                )

            `;


            piece.style.opacity =
                Math.max(
                    0,
                    1 -
                    progress *
                    1.06
                );

        }
    );

}



/* =====================================================
   ВРАЩЕНИЕ КОЛЕСА
===================================================== */

let dragging = false;

let previousPointerAngle = 0;

let wheelRotation = 0;

let totalRotation = 0;

let finished = false;


/*
Около 1.25 оборота.
*/

const requiredRotation =
    360 * 1.25;



function getPointerAngle(event){

    const rect =
        wheel.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    return (
        Math.atan2(

            event.clientY -
            centerY,

            event.clientX -
            centerX

        )

        *

        180 /
        Math.PI
    );

}



/* =====================================================
   НАЧАЛО ВРАЩЕНИЯ
===================================================== */

wheel.addEventListener(
    "pointerdown",
    event => {

        if(finished){
            return;
        }


        dragging = true;


        wheel.classList.add(
            "dragging"
        );


        previousPointerAngle =
            getPointerAngle(
                event
            );


        wheel.setPointerCapture(
            event.pointerId
        );


        hint.style.opacity =
            ".35";

    }
);



/* =====================================================
   ВРАЩЕНИЕ
===================================================== */

wheel.addEventListener(
    "pointermove",
    event => {

        if(
            !dragging ||
            finished
        ){
            return;
        }


        const currentAngle =
            getPointerAngle(
                event
            );


        let delta =
            currentAngle -
            previousPointerAngle;


        /*
        Исправление перехода
        через -180 / +180.
        */

        if(delta > 180){

            delta -= 360;

        }


        if(delta < -180){

            delta += 360;

        }


        previousPointerAngle =
            currentAngle;


        wheelRotation +=
            delta;


        totalRotation +=
            Math.abs(
                delta
            );


        /*
        Само колесо
        */

        wheel.style.transform = `

            rotate(
                ${wheelRotation}deg
            )

        `;


        /*
        Калейдоскоп вращается
        одновременно.
        */

        kaleidoscope.style.transform = `

            rotate(
                ${
                    wheelRotation *
                    .72
                }deg
            )

        `;


        const progress =
            Math.min(

                totalRotation /
                requiredRotation,

                1
            );


        updatePieces(
            progress
        );


        if(progress >= 1){

            revealPicture();

        }

    }
);



/* =====================================================
   КОНЕЦ ВРАЩЕНИЯ
===================================================== */

function stopDragging(){

    dragging = false;


    wheel.classList.remove(
        "dragging"
    );

}


wheel.addEventListener(
    "pointerup",
    stopDragging
);


wheel.addEventListener(
    "pointercancel",
    stopDragging
);



/* =====================================================
   ПОЯВЛЕНИЕ КАРТИНКИ
===================================================== */

function revealPicture(){

    if(finished){
        return;
    }


    finished = true;


    hiddenPicture.classList.add(
        "visible"
    );


    hint.textContent =
        "Что ты увидел?";


    hint.style.opacity =
        "1";


    setTimeout(
        () => {

            next.classList.add(
                "visible"
            );

        },

        650
    );

}



/* =====================================================
   ЗАГРУЗКА РАУНДА
===================================================== */

function loadRound(){

    const round =
        rounds[
            roundIndex
        ];


    picture.textContent =
        round.emoji;


    hiddenPicture.classList.remove(
        "visible"
    );


    next.classList.remove(
        "visible"
    );


    hint.textContent =
        "Покрути волшебное колесо ✨";


    hint.style.opacity =
        "1";


    dragging = false;

    finished = false;

    totalRotation = 0;

    wheelRotation = 0;


    wheel.style.transform =
        "rotate(0deg)";


    kaleidoscope.style.transform =
        "rotate(0deg)";


    createKaleidoscope();

}



/* =====================================================
   ДАЛЬШЕ
===================================================== */

next.addEventListener(
    "click",
    () => {

        roundIndex++;


        if(
            roundIndex >=
            rounds.length
        ){

            roundIndex = 0;

        }


        loadRound();

    }
);



/* =====================================================
   СТАРТ
===================================================== */

loadRound();

</script>


</body>

</html>
